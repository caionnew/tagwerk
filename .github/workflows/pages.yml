# Veröffentlicht dist/ auf GitHub Pages, wenn alle Einheitstests bestehen.
# Einmalig einstellen: Settings → Pages → Source: „GitHub Actions“.
# Schlägt ein Lauf fehl: unter Actions → Pages → „Run workflow“ neu starten (oder einfach den nächsten Patch einspielen).
name: Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
      # Eigener Artefaktname je Versuch: Bei „Re-run jobs“ lädt der zweite Versuch sonst ein zweites „github-pages“
      # in denselben Lauf, und deploy-pages bricht mit „Multiple artifacts named github-pages“ ab.
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist, name: 'github-pages-${{ github.run_attempt }}' }
      - id: deployment
        uses: actions/deploy-pages@v5
        with: { artifact_name: 'github-pages-${{ github.run_attempt }}' }
