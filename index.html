/* ---------- Wiederholung: FSRS-6 (wie Anki), tagesbasiert ---------- */
const FSRS = (() => {
  const W = [0.212, 1.2931, 2.3065, 8.2956, 6.4133, 0.8334, 3.0194, 0.001, 1.8722, 0.1666, 0.796, 1.4835, 0.0614, 0.2629, 1.6483, 0.6014, 1.8729, 0.5425, 0.0912, 0.0658, 0.1542];
  const DECAY = -W[20];
  const FACTOR = Math.pow(0.9, 1 / DECAY) - 1;
  const RETENTION = 0.9, MAX_IVL = 3650, S_MIN = 0.001;
  const clampD = d => Math.min(10, Math.max(1, d));
  const clampS = s => Math.max(S_MIN, s);
  const d0 = (g, clamp) => { const d = W[4] - Math.exp(W[5] * (g - 1)) + 1; return clamp ? clampD(d) : d; };
  const R = (elapsed, s) => Math.pow(1 + FACTOR * elapsed / s, DECAY);
  function nextD(d, g){
    const delta = -W[6] * (g - 3);
    const damped = d + (10 - d) * delta / 9;
    return clampD(W[7] * d0(4, false) + (1 - W[7]) * damped);
  }
  function shortTerm(s, g){
    let inc = Math.exp(W[17] * (g - 3 + W[18])) * Math.pow(s, -W[19]);
    if (g >= 2) inc = Math.max(inc, 1);
    return clampS(s * inc);
  }
  function recall(d, s, r, g){
    const hard = g === 2 ? W[15] : 1, easy = g === 4 ? W[16] : 1;
    return clampS(s * (1 + Math.exp(W[8]) * (11 - d) * Math.pow(s, -W[9]) * (Math.exp((1 - r) * W[10]) - 1) * hard * easy));
  }
  function forget(d, s, r){
    const longTerm = W[11] * Math.pow(d, -W[12]) * (Math.pow(s + 1, W[13]) - 1) * Math.exp((1 - r) * W[14]);
    const shortT = s / Math.exp(W[17] * W[18]);
    return clampS(Math.min(longTerm, shortT));
  }
  function interval(s){
    const ivl = Math.round((s / FACTOR) * (Math.pow(RETENTION, 1 / DECAY) - 1));
    return Math.min(MAX_IVL, Math.max(1, ivl));
  }
  function fuzz(ivl){
    if (ivl < 2.5) return ivl;
    let delta = 1;
    [[2.5, 7, 0.15], [7, 20, 0.1], [20, Infinity, 0.05]].forEach(([a, b, f]) => { delta += f * Math.max(Math.min(ivl, b) - a, 0); });
    const lo = Math.max(2, Math.round(ivl - delta)), hi = Math.min(Math.round(ivl + delta), MAX_IVL);
    return Math.min(hi, Math.max(lo, Math.floor(Math.random() * (hi - lo + 1)) + lo));
  }
  // g: 1 = nicht gewusst, 2 = knapp, 3 = gewusst
  function review(card, g, todayStr, noFuzz){
    const c = Object.assign({}, card);
    if (c.s == null || c.d == null) { c.s = clampS(W[g - 1]); c.d = d0(g, true); }
    else {
      const elapsed = Math.max(0, dayDiff(todayStr, c.last));
      if (elapsed < 1) c.s = shortTerm(c.s, g);
      else c.s = g === 1 ? forget(c.d, c.s, R(elapsed, c.s)) : recall(c.d, c.s, R(elapsed, c.s), g);
      c.d = nextD(c.d, g);
    }
    let ivl = interval(c.s);
    if (!noFuzz) ivl = fuzz(ivl);
    c.ivl = ivl; c.last = todayStr; c.due = addDays(todayStr, ivl);
    return c;
  }
  const retrievability = (card, todayStr) => (card && card.s && card.last ? R(Math.max(0, dayDiff(todayStr, card.last)), card.s) : 0);
  return { review, retrievability, interval };
})();

function closest(input, answers, lang){
  const a = norm(input, lang).split(' ');
  let best = answers[0], score = -1;
  answers.forEach(ans => {
    const b = norm(ans, lang).split(' ');
    const sc = lcs(a, b) / Math.max(a.length, b.length);
    if (sc > score) { score = sc; best = ans; }
  });
  return best;
}
function lcs(a, b){
  const dp = Array.from({ length:a.length + 1 }, () => new Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--) dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  return dp[0][0];
}
function judge(input, answers, lang){

  if (answers.some(a => norm(a, lang) === n)) return 'ok';
  if (answers.some(a => deacc(norm(a, lang)) === deacc(n))) return 'near';
  return 'bad';
}

  const Y = norm(typed, lang).split(' ').filter(Boolean), yb = Y.map(deacc);
  const idx = tb.map((w, i) => (w ? i : -1)).filter(i => i >= 0);
  const m = idx.length, n = yb.length;

  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) dp[i][j] = tb[idx[i]] === yb[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const st = T.map((_, k) => (tb[k] ? 'miss' : 'ok'));
  let i = 0, j = 0, hit = 0;
  while (i < m && j < n) {
    if (tb[idx[i]] === yb[j]) { st[idx[i]] = te[idx[i]] === Y[j] ? 'ok' : 'near'; if (st[idx[i]] === 'ok') hit++; i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;

  return { html:T.map((w, k) => `<span class="w-${st[k]}" data-a="lookup" data-w="${esc(w.replace(/^[¿¡"„“«(]+|[.!?,;:"„“”»)…]+$/g, ''))}">${esc(w)}</span>`).join(' '), score:m ? hit / m : 0 };
}
function answersFor(ex){

  if (ex.type === 'cloze') return (item.gapAlts.length ? item.gapAlts : [item.gap]).concat((st && st.gapAlts) || []);
  return [item.target].concat(item.alts, (st && st.alts) || []);

    const keys = [item.target].concat(item.alts).map(tileKey).concat((stOf(item.id) && stOf(item.id).tileAlts) || []);

    if (res !== 'ok') {

  DB.tatFetch[lang] = Date.now(); save();
  const mature = matureCount(lang);
  const wc = mature < 50 ? '3-8' : mature < 200 ? '4-10' : mature < 600 ? '5-12' : '6-16';
  const traps = Object.keys(TAT_Q[lang]);

      list.sort((a, b) => (b.audio ? 1 : 0) - (a.audio ? 1 : 0)).slice(0, 4).forEach(x => {
        const id = lang + ':tat:' + x.tid;

function pronTokens(text, lang){

  if (lang === 'sv') t = t.replace(/ i (dag|morgon|kväll|går|natt) /g, ' i$1 ');

function pronCheck(target, alts, lang){
  const T = pronTokens(target, lang);
  let best = null;
  alts.forEach(a => {
    const A = pronTokens(a, lang);
    const pool = A.slice();
    const hit = T.map(w => { const i = pool.findIndex(x => numSame(x, w, lang)); if (i >= 0) { pool.splice(i, 1); return true; } return false; });
    const score = hit.filter(Boolean).length / Math.max(1, T.length);
    if (!best || score > best.score) best = { heard:a, hit, score };
  });
  return best;
}

  let sv = (t.match(/[åäö]/g) || []).length * 2, es = (t.match(/[ñ¿¡áíóú]/g) || []).length * 2;
  ['och', 'jag', 'att', 'är', 'det', 'inte', 'som', 'på'].forEach(w => { if (t.includes(' ' + w + ' ')) sv++; });

const ERR_TYPES = { free:'Freies Übersetzen', gap:'Lücke füllen', tiles:'Wortkästchen', hear:'Hören', spot:'Fehler finden', genus:'Genus', time:'Uhrzeiten & Zahlen', trans:'Umbauen' };

function lev(a, b){
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length:n + 1 }, (_, j) => j);
  // Mit Vertauschung benachbarter Buchstaben als einem Schritt (lehce → leche)
  let pp = null;
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      if (pp && i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) cur[j] = Math.min(cur[j], pp[j - 2] + 1);
    }
    pp = prev; prev = cur;
  }
  return prev[n];
}
// Welche Art Fehler? Vergleich mit der ähnlichsten erlaubten Lösung
function errKind(input, answers, lang){
  const words = x => norm(x, lang).split(' ').filter(Boolean).map(deacc);
  const A = words(input); if (!A.length) return null;
  let best = null, score = -1;
  answers.forEach(x => { const B = words(x); const c = B.filter(w => A.includes(w)).length - Math.abs(B.length - A.length) * 0.1; if (c > score) { score = c; best = B; } });
  if (!best || !best.length) return null;
  const key = x => x.slice().sort().join(' ');
  if (A.join(' ') === best.join(' ')) return null;
  if (A.length > 1 && key(A) === key(best)) return 'order';
  const missing = best.filter(w => !A.includes(w)), extra = A.filter(w => !best.includes(w));
  if (!extra.length && missing.length) return 'missing';
  // Knapp daneben zählt nur als Schreibfehler, wenn das Getippte kein echtes Wort ist.
  // „stor“ statt „stort“ oder „gusta“ statt „gustan“ sind echte Wörter in falscher Form: ein Grammatikfehler.
  const raw = norm(input, lang).split(' ').filter(Boolean);
  const isWord = w => { const orig = raw.find(r => deacc(r) === w) || w; return !!lookupWord(lang, orig); };
  if (extra.length && extra.length === missing.length && extra.every(w => !isWord(w) && missing.some(m => lev(w, m) <= Math.max(1, Math.floor(m.length / 4))))) return 'spell';
  return 'word';
}
function errType(ex){

// Verschiedene Wörter (Grundformen) in deinen Sätzen
function vocabCount(lang){
  const all = new Set(), firm = new Set();
  BANK[lang].forEach(i => {
    const st = stOf(i.id); if (!st) return;
    tokens(i.target).forEach(w => {
      const k = w.toLowerCase(); if (!/[a-zåäöéáíóúñü]/i.test(k)) return;
      const e = lookupWord(lang, k), base = (e && e.l) || k;
      all.add(base); if ((st.ivl || 0) >= MATURE) firm.add(base);

}

// Etappen aus den gespeicherten Tagesdaten rekonstruieren
const WAY_TASKS = [100, 500, 1000, 2500, 5000, 10000, 25000, 50000];
const WAY_HOURS = [1, 5, 10, 25, 50, 100, 250, 500];
const WAY_MATURE = [10, 25, 50, 100, 250, 500, 1000, 1500, 2000];
const WAY_STREAK = [7, 30, 100, 200, 365, 730];
const WAY_WORDS = [100, 250, 500, 1000, 1500, 2000];
function wayEvents(){
  const ev = [], days = Object.keys(DB.log || {}).filter(d => ['sv', 'es'].some(l => (dayLog(d, l).n || 0) > 0)).sort();
  if (!days.length) return { done:[], next:[] };
  ev.push({ d:days[0], ico:'start', t:'Erster Übungstag' });
  let n = 0, secs = 0; const mat = { sv:0, es:0 }, ti = { i:0 }, hi = { i:0 }, mi = { sv:0, es:0 };
  days.forEach(d => {
    ['sv', 'es'].forEach(l => {
      const x = dayLog(d, l); n += x.n || 0; secs += x.secs || 0; mat[l] += x.mat || 0;
      while (mi[l] < WAY_MATURE.length && mat[l] >= WAY_MATURE[mi[l]]) { ev.push({ d, ico:'mature', t:`${WAY_MATURE[mi[l]]} gefestigte Sätze ${LANG[l].deName}` }); mi[l]++; }
    });
    while (ti.i < WAY_TASKS.length && n >= WAY_TASKS[ti.i]) { ev.push({ d, ico:'tasks', t:`${WAY_TASKS[ti.i].toLocaleString('de-DE')} Aufgaben` }); ti.i++; }
    while (hi.i < WAY_HOURS.length && secs >= WAY_HOURS[hi.i] * 3600) { ev.push({ d, ico:'time', t:`${WAY_HOURS[hi.i]} ${WAY_HOURS[hi.i] === 1 ? 'Stunde' : 'Stunden'} geübt` }); hi.i++; }
  });
  // Serien nach derselben Regel wie die Serienanzeige: ein freier Tag pro Woche unterbricht nicht
  const doneDays = Object.keys(DB.done || {}).filter(d => DB.done[d]).sort();
  if (doneDays.length) {
    let streak = 0, misses = [], si = 0, d = doneDays[0];
    const end = today();
    while (d <= end) {
      if (DB.done[d]) { streak++; while (si < WAY_STREAK.length && streak >= WAY_STREAK[si]) { ev.push({ d, ico:'streak', t:`${WAY_STREAK[si]} Tage in Folge` }); si++; } }
      else if (d !== end) {
        misses = misses.filter(m => dayDiff(d, m) < 7);
        if (misses.length) { streak = 0; misses = []; } else misses.push(d);
      }
      d = addDays(d, 1);
    }
  }
  ['sv', 'es'].forEach(l => {
    const firstOwn = (DB.own[l] || []).filter(o => o.created).map(o => o.created).sort()[0];
    if (firstOwn) ev.push({ d:firstOwn, ico:'own', t:`Erster eigener Satz ${LANG[l].deName}` });
    // Wortschatz und Themen erst seit den erweiterten Tagesständen
    // Nur Schwellen, die zwischen zwei Erfassungen überschritten wurden. Was schon beim ersten Erfassen erreicht war, hat kein bekanntes Datum.
    let prev = null;
    Object.keys(DB.snap || {}).sort().forEach(d => {
      const x = DB.snap[d][l]; if (!x || x.w == null) return;
      if (prev) {
        WAY_WORDS.forEach(th => { if (prev.w < th && x.w >= th) ev.push({ d, ico:'words', t:`${th} verschiedene Wörter ${LANG[l].deName}` }); });
        Object.keys(x.t || {}).forEach(tr => {
          const total = BANK[l].filter(i => i.trap === tr).length, meta = trapMeta(l, tr);
          if (meta && total >= 6 && (prev.t[tr] || 0) / total < 0.5 && x.t[tr] / total >= 0.5) ev.push({ d, ico:'topic', t:`„${meta.label}“ zur Hälfte gefestigt` });
        });
      }
      prev = { w:x.w, t:x.t || {} };
    });
    const texts = (DB.texts || []).filter(x => x.lang === l).map(x => x.date).sort();
    if (texts.length) ev.push({ d:texts[0], ico:'write', t:`Erster Text ${LANG[l].deName}` });
    if (texts.length >= 10) ev.push({ d:texts[9], ico:'write', t:`10 Texte ${LANG[l].deName}` });
  });

  const next = [];
  ['sv', 'es'].forEach(l => { if (!BANK[l].some(i => stOf(i.id))) return; const m = matureCount(l), nx = WAY_MATURE.find(x => x > m); if (nx) next.push({ ico:'mature', t:`${nx} gefestigte Sätze ${LANG[l].deName}`, rest:`noch ${nx - m}` }); });
  const nh = WAY_HOURS.find(x => x * 3600 > secs); if (nh) next.push({ ico:'time', t:`${nh} Stunden geübt`, rest:`noch ${fmtMin(nh * 3600 - secs).replace(/\.$/, '')}` });
  return { done:ev, next:next.slice(0, 3) };
}

// Treffsichere Hinweise zu den Themen der App. Jeder Hinweis: Textstelle, Erklärung, Thema
function textHints(lang, text){

  const add = (m, msg, topic) => { const k = topic + m.toLowerCase(); if (seen.has(k)) return; seen.add(k); hints.push({ at:m.trim(), msg, topic }); };
  const t = ' ' + String(text).replace(/\s+/g, ' ') + ' ';
  const sents = sentSplit(text);
  const cap = x => x[0].toUpperCase() + x.slice(1);
  if (lang === 'sv') {
    const PRON = '(jag|du|han|hon|vi|ni|de|man|det)';
    const FRONT = '(idag|i dag|igår|i går|imorgon|i morgon|ikväll|i kväll|imorse|nu|ibland|ofta|alltid|här|där|därför|tyvärr|först|sen|senare|efteråt|på (?:måndag|tisdag|onsdag|torsdag|fredag|lördag|söndag)|i (?:helgen|sommar|vinter|höst|vår))';
    sents.forEach(s => {
      const m = s.match(new RegExp(`^${FRONT}\\s+${PRON}\\s+(\\S+)`, 'i'));
      if (m && !/^(inte|aldrig|också|bara)$/i.test(m[3])) add(m[0], `Steht „${m[1].toLowerCase()}“ vorn, kommt das Verb vor das Subjekt: ${cap(m[1].toLowerCase())} ${m[3].replace(/[.,!?]$/, '')} ${m[2].toLowerCase()} …`, 'inversion');
      const c = s.match(new RegExp(`^(när|om|eftersom|innan|medan|fast)\\s[^,]+,\\s*${PRON}\\s+(\\S+)`, 'i'));
      if (c && !/^(inte|aldrig)$/i.test(c[3])) add(c[0], `Nach dem Nebensatz vorn kommt zuerst das Verb: …, ${c[3].replace(/[.,!?]$/, '')} ${c[2].toLowerCase()} …`, 'inversion');
    });
    const ADV = 'inte|aldrig|alltid|ofta|kanske|redan|också|bara|gärna|verkligen';
    for (const m of t.matchAll(new RegExp(`\\b(att|eftersom|om|när|fast|medan|innan|som)\\s+${PRON}\\s+(\\S+)\\s+(${ADV})\\b`, 'gi'))) {
      if (new RegExp(`^(${ADV})$`, 'i').test(m[3])) continue;

function learningWords(lang){
  const out = new Map();
  // Nur Inhaltswörter: keine Funktionswörter, Bindewörter oder Verbindungswörter, Grundform mindestens 4 Buchstaben
  const skip = w => w.length < 4 || W_STOP.has(w) || W_SUBS[lang].includes(w) || W_CONN[lang].includes(w);
  BANK[lang].forEach(i => { const st = stOf(i.id); if (!st || (st.ivl || 0) >= MATURE) return; wTokens(i.target).forEach(w => { if (skip(w)) return; const e = lookupWord(lang, w); const base = (e && e.l) || w; if (skip(base)) return; if (!out.has(base)) out.set(base, { w, base, de:e ? e.de.split(';')[0].replace(/\s*\(.*$/, '') : '' }); }); });
  return [...out.values()];
}
function analyzeText(lang, text){
  const sents = sentSplit(text), toks = wTokens(text);
  const words = toks.length, lower = ' ' + toks.join(' ') + ' ';
  const has = (s, x) => (' ' + wTokens(s).join(' ') + ' ').includes(' ' + x + ' ');
  const subs = W_SUBS[lang].filter(x => lower.includes(' ' + x + ' '));
  const subCount = sents.filter(s => W_SUBS[lang].some(x => has(s, x))).length;
  const conns = W_CONN[lang].filter(x => lower.includes(' ' + x + ' '));
  const tenses = tensesOf(lang, toks);
  const long = toks.filter(w => w.length > 6).length;
  const lix = words && sents.length ? Math.round(words / sents.length + 100 * long / words) : 0;
  const learnSet = new Map(learningWords(lang).map(x => [x.base, x]));
  const used = new Set();
  toks.forEach(w => { const e = lookupWord(lang, w); const base = (e && e.l) || w; if (learnSet.has(base)) used.add(base); });
  const unknown = [...new Set(toks.filter(w => w.length > 2 && !lookupWord(lang, w)))].slice(0, 8);
  const lemmas = new Set(toks.map(w => { const e = lookupWord(lang, w); return (e && e.l) || w; }));
  const frontedOk = lang === 'sv' && sents.some(s => /^(idag|i dag|igår|i går|imorgon|i morgon|ikväll|nu|ibland|ofta|sedan|sen|på \S+|i \S+)\s+(\S+)\s+(jag|du|han|hon|vi|ni|de|man|det)\b/i.test(s));
  return { words, sents:sents.length, avg:sents.length ? Math.round(words / sents.length * 10) / 10 : 0, lix, tenses:[...tenses], subs, subCount, conns, newUsed:[...used], unknown, variety:lemmas.size, frontedOk, hints:textHints(lang, text) };
}

function pickExtra(lang, avoidK){
  const list = W_EXTRA[lang], recent = (DB.texts || []).filter(x => x.lang === lang).slice(-4);
  const missed = x => recent.filter(r => !(r.done || []).includes(x.k)).length;
  const scored = list.filter(x => x.k !== avoidK).map(x => ({ x, s:missed(x) + Math.random() * 1.5 }));

}

    if (!BANK_SPOTS_ES) BANK_SPOTS_ES = bankSpotsEs();

    cum += dayLog(ds, lang).fresh || 0;
    if (k % step && k !== span) continue;
    let sn = null;
    for (let b = 0; b < step && !sn; b++) { const x = DB.snap && DB.snap[addDays(ds, -b)]; if (x && x[lang]) sn = x[lang]; }

  }
  const last = pts[pts.length - 1];
  const max = Math.max(4, ...pts.map(p => Math.max(p.n, p.m || 0, p.k || 0)));
  const st = niceStep(max), top = Math.ceil(max / st) * st;
  const W = 340, H = 168, L = 30, R = 36, T = 10, B = 20;
  const X = i => L + (pts.length === 1 ? 0 : i / (pts.length - 1)) * (W - L - R);
  const Y = v => T + (1 - v / top) * (H - T - B);
  let g = '';
  for (let v = 0; v <= top; v += st) g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" class="gl"/><text x="${L - 5}" y="${Y(v) + 3}" class="yl">${v}</text>`;
  const path = key => { let dstr = '', pen = false; pts.forEach((p, i) => { const v = p[key]; if (v == null) { pen = false; return; } dstr += `${pen ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`; pen = true; }); return dstr; };

  const ends = [];

    const dstr = path(key); if (!dstr) return;

  return `<h2 class="grp">Verlauf</h2><div class="chart">
    <svg viewBox="0 0 ${W} ${H}" class="pcsvg" role="img" aria-label="Verlauf der geübten, abrufbaren und gefestigten Sätze">${g}</svg>
    <p class="legend calleg"><span><i class="lk ln-n"></i>geübt</span><span><i class="lk ln-k"></i>geschätzt abrufbar</span><span><i class="lk ln-m"></i>gefestigt</span></p>
    ${late ? `<p class="legend">Abrufbar und gefestigt werden seit dem ${fmt(snapFrom)} erfasst.</p>` : !snapFrom ? '<p class="legend">Abrufbar und gefestigt werden ab heute erfasst.</p>' : ''}
  </div>`;

// Lücke: immer gleich breit, solange sie leer ist (verrät nichts über die Lösung), und wächst mit dem Getippten
let gapMeasure = null;
const NATIVE_GAP = typeof CSS !== 'undefined' && CSS.supports && CSS.supports('field-sizing', 'content');
function sizeGap(el){
  if (!el || !el.classList || !el.classList.contains('gapin') || NATIVE_GAP) return;
  const val = el.value || '';
  if (!val) { el.style.width = ''; return; }
  let w = 0;
  try {
    if (!gapMeasure) { gapMeasure = document.createElement('span'); gapMeasure.className = 'gapmeasure'; gapMeasure.setAttribute('aria-hidden', 'true'); document.body.appendChild(gapMeasure); }
    gapMeasure.style.font = getComputedStyle(el).font;
    gapMeasure.style.letterSpacing = getComputedStyle(el).letterSpacing;
    gapMeasure.textContent = val;
    w = gapMeasure.getBoundingClientRect().width;
  } catch (e) {}
  const box = el.closest('.cloze');
  const max = box ? box.getBoundingClientRect().width : 0;
  if (w > 0) el.style.width = `${Math.round(Math.min(max || Infinity, w * 1.2 + 30))}px`;
  else el.style.width = `calc(${val.length + 2}ch + 12px)`;
}

function nextPrompt(){
  DB.used = DB.used || {}; let used = DB.used.write || [];
  let pool = WRITE_PROMPTS.filter(p => !used.includes(p));
  if (!pool.length) { used = []; pool = WRITE_PROMPTS.slice(); }
  const p = pick(pool); used.push(p); DB.used.write = used; save();
  return p;
}
function saveDraft(){ if (!S.write) return; DB.draft = DB.draft || {}; DB.draft[S.write.lang] = { prompt:S.write.prompt, text:S.write.text, id:S.write.id, extra:S.write.extra }; save(); }
// Neue Schreibaufgabe: eigene Kennung fürs Archiv, Extra-Aufgabe (falls gewünscht) und drei Wörter zum Einbauen
function newWrite(lang, prompt, text, keep){
  const words = shuffle(learningWords(lang)).slice(0, 3);
  return Object.assign({ lang, prompt, text:text || '', copied:false, lt:null, prof:null, id:'w' + Date.now().toString(36), extra:DB.settings.wextra === false ? '' : pickExtra(lang), sugg:words }, keep || {});
}
let draftTimer = null;
function saveDraftSoon(){ clearTimeout(draftTimer); draftTimer = setTimeout(saveDraft, 800); }

document.addEventListener('pointerdown', e => { if (e.target.closest('[data-c]')) e.preventDefault(); });
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled) return;
  const a = b.dataset.a;
  if (!['coldel', 'reset'].includes(a)) S.armed = null;
  if (a === 'reset' && S.armed && S.armed !== 'reset:' + (b.dataset.l || S.lang)) S.armed = null;

      goView(b.dataset.v); break;
    }
    case 'lang': S.lang = b.dataset.l; DB.settings.lang = S.lang; S.notice = null; save(); render(); break;
    case 'daily': { const d = openDaily(); if (d && d.lang === S.lang) { resumeDaily(); render(); window.scrollTo(0, 0); } else startRun('daily'); break; }

    case 'trapgo': startRun('trap', { trap:b.dataset.t }); break;
    case 'forms': { const g = genIds(S.lang); if (g.length === 1) startRun('gen', { gen:g[0] }); else goView('pickGen'); break; }
    case 'gengo': startRun('gen', { gen:b.dataset.g }); break;
    case 'dict': startRun('dict'); break;
    case 'again': if (r) { S.lang = r.lang; startRun(r.kind, { trap:r.trap, gen:r.gen }); } break;
    case 'check': check(); break;
    case 'giveup': giveUp(); setTimeout(() => { DB.used = DB.used || {}; DB.used.gaveup = true; save(); }, 0); break;
    case 'accept': DB.used = DB.used || {}; DB.used.accept = true; selfAccept(); break;
    case 'next': next(); break;
    case 'endrun': if (r) { r.ended = true; if (r.cur && r.cur.state === 'done') { r.endless = false; r.queue = r.queue.slice(0, r.idx + 1); next(); } else finishRun(); } break;
    case 'quit': {
      if (!r) break;
      if (r.kind === 'daily') {
        S.dailyRun = r; persistRun();
        S.view = 'home'; render(); window.scrollTo(0, 0); break;
      }
      // Beenden ist nie verlustreich: Antworten sind schon gespeichert, offene Aufgaben entfallen einfach
      if (r.cur && r.cur.state === 'done') { r.ended = true; r.queue = r.queue.slice(0, r.idx + 1); next(); break; }
      r.ended = true;

      break;
    }
    case 'unpick': { const ex = r.queue[r.idx]; const i = Number(b.dataset.i); ex.picked = ex.picked.filter(x => x !== i); render(); break; }
    case 'resetTiles': { r.queue[r.idx].picked = []; render(); break; }

    case 'speakItem': playItem(itemById(b.dataset.id)); break;

    case 'moreNew': startRun('extraNew', { n:Number(b.dataset.n) || 0 }); break;
    case 'lookup': {
      const w = (b.dataset.w || '').trim(); if (!w || /^\d+$/.test(w)) break;
      const lang = (S.view === 'run' && S.run && S.run.lang) || S.lang;
      DB.used = DB.used || {}; DB.used.lookup = true; save();
      S.pop = { lang, w, entry:lookupWord(lang, w), status:'idle', web:[] };
      renderPopup(); break;
    }
    case 'popclose': S.pop = null; renderPopup(); break;
    case 'popext': { const P = S.pop; if (!P) break; window.open(P.lang === 'es' ? `https://dict.leo.org/spanisch-deutsch/${encodeURIComponent(P.w)}` : `https://sv-de.dict.cc/?s=${encodeURIComponent(P.w)}`, '_blank', 'noopener'); break; }
    case 'popweb': {
      const P = S.pop; if (!P) break;
      if (navigator.onLine === false) { P.status = 'error'; P.err = 'Keine Verbindung.'; renderPopup(); break; }
      P.status = 'loading'; renderPopup();
      wiktionary(P.lang, P.w).then(list => { if (S.pop === P) { P.status = 'web'; P.web = list; renderPopup(); } })
        .catch(() => { if (S.pop === P) { P.status = 'web'; P.web = []; renderPopup(); } });
      break;
    }
    case 'autoplay': DB.settings.autoplay = !DB.settings.autoplay; save(); render(); break;
    case 'calday': S.calDay = S.calDay === b.dataset.d ? null : b.dataset.d; render(); break;
    case 'toSettings': case 'settings': S.notice = null; S.settingsFrom = ['home', 'extra', 'progress'].includes(S.view) ? S.view : 'home'; goView('settings'); break;
    case 'colall': S.colAll = !S.colAll; render(); break;
    case 'findopen': S.findOpen = b.dataset.id; render(); break;
    case 'hard': startRun('hard'); break;
    case 'export': {
      const blob = new Blob([JSON.stringify(DB, null, 1)], { type:'application/json' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob); link.download = `tagwerk-backup-${today()}.json`;
      document.body.appendChild(link); link.click();
      DB.lastBackup = today(); save();
      setTimeout(() => { URL.revokeObjectURL(link.href); link.remove(); }, 1500);
      break;
    }
    case 'reset': {
      const key = 'reset:' + (b.dataset.l || S.lang);
      if (S.armed === key) {
        const lang = b.dataset.l || S.lang;
        Object.keys(DB.st).forEach(id => { if (id.startsWith(lang + ':')) delete DB.st[id]; });
        DB.own[lang] = []; DB.tat[lang] = [];
        Object.keys(DB.gen).forEach(g => { if (GENS[g] && GENS[g].lang === lang) delete DB.gen[g]; });
        Object.values(DB.log).forEach(d => { delete d[lang]; });
        if (DB.snap) Object.values(DB.snap).forEach(d => { delete d[lang]; });
        if (DB.genus) delete DB.genus[lang];
        if (DB.run && DB.run.lang === lang) DB.run = null;
        if (S.dailyRun && S.dailyRun.lang === lang) S.dailyRun = null;
        S.armed = null; save(); buildBank(); note(`${LANG[lang].deName} ist zurückgesetzt.`, 'ok');
      } else S.armed = key;
      render(); break;
    }
  }
});
document.addEventListener('input', e => {
  const r = S.run;
  if (e.target.id === 'answer' && r && r.cur) { r.cur.input = e.target.value; sizeGap(e.target); }
  if (e.target.id === 'wtext' && S.write) { S.write.text = e.target.value; saveDraftSoon(); }
  if (e.target.id === 'ownDe' && S.own) S.own.de = e.target.value;
  if (e.target.id === 'ownT' && S.own) S.own.t = e.target.value;
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
  if (e.target.id === 'answer' && S.run && S.run.cur) {
    e.preventDefault();
    if (S.run.cur.state === 'answer') check(); else next();
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'tatTrap' && S.tat) S.tat.trap = el.value;
  if (el.id === 'importFile' && el.files && el.files[0]) {
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const d = JSON.parse(fr.result);
        if (!d || typeof d !== 'object' || !d.st) throw new Error('format');
        S.undoDB = JSON.stringify(DB);
        DB = Object.assign(freshDB(), d); DB.own = Object.assign({ sv:[], es:[] }, d.own || {}); DB.tat = Object.assign({ sv:[], es:[] }, d.tat || {});
        DB.settings = Object.assign(freshDB().settings, d.settings || {});
        migrateStates(); save(); buildBank(); S.notice = { text:'Backup eingespielt.', kind:'ok', action:{ label:'Rückgängig', a:'undoimport' } };
      } catch (err) { note('Diese Datei ist kein Tagwerk-Backup.', 'warn'); }
      render();
    };
    fr.readAsText(el.files[0]);
  }
});

window.addEventListener('pagehide', () => { if (S.write && S.view === 'write') { DB.draft = DB.draft || {}; DB.draft[S.write.lang] = { prompt:S.write.prompt, text:S.write.text }; } flushSave(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { if (S.write && S.view === 'write') { DB.draft = DB.draft || {}; DB.draft[S.write.lang] = { prompt:S.write.prompt, text:S.write.text }; } flushSave(); } });
/* ---------- Start ---------- */
load();
S.lang = DB.settings.lang || 'sv';
buildBank();
buildGloss();
pruneTlog();
snapshot();
// Den Browser bitten, die Daten dauerhaft zu behalten und nicht bei Speicherknappheit zu löschen
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persisted().then(p => { if (!p) navigator.storage.persist(); }); } catch (e) {}
restoreRun();
if (!handleLaunch()) render(); else if (S.view === 'own') render();
setTimeout(() => { refill('sv'); refill('es'); }, 1500);
if (canSpeak()) { window.speechSynthesis.getVoices(); window.speechSynthesis.onvoiceschanged = () => { if (S.view === 'extra') render(); }; }
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  // Nach einem Update: Hinweis, sobald die neue Version bereitsteht (nicht beim allerersten Installieren)
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController) return;
    S.notice = { text:'Eine neue Version ist da.', kind:'ok', action:{ label:'Neu laden', a:'reload' } };
    if (S.view !== 'run') render();
  });
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

})();
</script>
</body>
</html>
