# Bei jedem Push und Pull Request: bauen, Einheitstests, Browser-Tests in Chromium und Firefox (eigener Job, läuft parallel).
name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-report, path: test-results/ }
  firefox:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps firefox
      - run: npx playwright test --project=firefox
        env: { PW_FIREFOX: '1' }
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-report-firefox, path: test-results/ }
