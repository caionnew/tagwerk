<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F3F5F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111715" media="(prefers-color-scheme: dark)">
<title>Tagwerk</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  color-scheme: light;
  --bg:#F3F5F4; --surface:#FFFFFF; --ink:#17201D; --muted:#5B6763; --faint:#A3ADA9; --line:#DCE2DF;
  --es:#E3A21A; --es-ink:#845500; --es-soft:#FBF0D6; --es-on:#241A00;
  --sv:#2367A3; --sv-ink:#1D5689; --sv-soft:#E2EDF7; --sv-on:#FFFFFF;
  --ok:#2D7A55; --ok-soft:#E1F1E8; --warn:#8F5B00; --warn-soft:#FAEFD9; --bad:#B4372F; --bad-soft:#F8E3E1;
  --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif;
  --serif: 'Noto Serif', 'Source Serif 4', Georgia, 'Times New Roman', serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#111715; --surface:#19211E; --ink:#E6ECE9; --muted:#9AA6A1; --faint:#56625D; --line:#2B3532;
    --es:#F0B33D; --es-ink:#F3C366; --es-soft:#2E2614; --es-on:#1E1700;
    --sv:#6FAEE6; --sv-ink:#8CC0EE; --sv-soft:#15263A; --sv-on:#08131F;
    --ok:#5CC28F; --ok-soft:#16291F; --warn:#E2A93B; --warn-soft:#2D2412; --bad:#F07D72; --bad-soft:#331A18;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#111715; --surface:#19211E; --ink:#E6ECE9; --muted:#9AA6A1; --faint:#56625D; --line:#2B3532;
  --es:#F0B33D; --es-ink:#F3C366; --es-soft:#2E2614; --es-on:#1E1700;
  --sv:#6FAEE6; --sv-ink:#8CC0EE; --sv-soft:#15263A; --sv-on:#08131F;
  --ok:#5CC28F; --ok-soft:#16291F; --warn:#E2A93B; --warn-soft:#2D2412; --bad:#F07D72; --bad-soft:#331A18;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:17px; line-height:1.5; -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent; }
body[data-lang="es"]{ --accent:var(--es); --accent-ink:var(--es-ink); --accent-soft:var(--es-soft); --on-accent:var(--es-on); }
body[data-lang="sv"]{ --accent:var(--sv); --accent-ink:var(--sv-ink); --accent-soft:var(--sv-soft); --on-accent:var(--sv-on); }
button, select, input, textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
a{ color:var(--accent-ink); }
.wrap{ max-width:620px; margin:0 auto; padding:12px 18px calc(92px + env(safe-area-inset-bottom,0px)); }
body.focus .wrap{ padding-bottom:calc(24px + env(safe-area-inset-bottom,0px)); }
body.has-actions .wrap{ padding-bottom:calc(104px + env(safe-area-inset-bottom,0px)); }

/* Kopfzeile & Navigation */
.topline{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin:6px 0 18px; }
.langseg{ display:inline-flex; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:3px; }
.langseg button{ border:0; background:none; padding:8px 16px; border-radius:999px; font-weight:650; font-size:15.5px; color:var(--muted); }
.langseg button[aria-checked="true"]{ background:var(--accent); color:var(--on-accent); }
.streak{ font-size:14px; color:var(--muted); }
.bottomnav{ position:fixed; left:0; right:0; bottom:0; z-index:10; display:flex; justify-content:center; gap:4px; background:var(--surface); border-top:1px solid var(--line); padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px)); }
.bottomnav[hidden]{ display:none; }
.bottomnav button{ flex:1; max-width:190px; border:0; background:none; padding:11px 4px; border-radius:12px; font-size:14.5px; font-weight:650; color:var(--muted); }
.bottomnav button[aria-current="page"]{ background:var(--accent-soft); color:var(--accent-ink); }
.backbar{ display:flex; align-items:center; gap:12px; margin:6px 0 18px; }
.vt{ font-size:19px; font-weight:700; margin:0; }
.x{ flex:none; min-width:40px; height:40px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--muted); font-size:22px; line-height:1; padding:0 12px; }
.x.armed{ color:var(--bad); font-size:15px; font-weight:650; }

/* Heute */
.today{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:20px 18px; margin:0 0 8px; }
.num{ font-size:28px; font-weight:750; letter-spacing:-0.015em; line-height:1.15; margin:0; }
.breakdown{ color:var(--muted); font-size:15.5px; margin:6px 0 16px; }
.grp{ font-size:14px; font-weight:650; color:var(--muted); margin:24px 4px 8px; }
.statline{ color:var(--muted); font-size:15px; margin:0 0 4px; }
.hint{ color:var(--muted); font-size:14.5px; margin:10px 0 0; }
.src{ color:var(--muted); font-size:13px; margin:12px 0 0; }
.notice{ border-radius:12px; padding:11px 14px; font-size:15px; margin:0 0 16px; }
.notice.ok{ background:var(--ok-soft); }
.notice.warn{ background:var(--warn-soft); }

/* Listen */
.rows{ background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden; }
.row{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:none; border:0; border-top:1px solid var(--line); padding:13px 16px; color:var(--ink); min-height:56px; }
.row:first-child{ border-top:0; }
button.row::after, label.row::after{ content:''; flex:none; width:8px; height:8px; margin-left:4px; border-top:2px solid var(--faint); border-right:2px solid var(--faint); transform:rotate(45deg); }
.row.static::after{ display:none; }
.row[disabled]{ opacity:.45; cursor:default; }
label.row{ cursor:pointer; }
.row .txt{ flex:1; min-width:0; }
.rt{ display:block; font-weight:650; font-size:16px; }
.rd{ display:block; color:var(--muted); font-size:14px; margin-top:1px; }
.row.danger .rt{ color:var(--bad); }
.row.armed{ background:var(--bad-soft); }
.bars .bar{ flex:none; width:28%; height:7px; border-radius:4px; background:var(--line); overflow:hidden; }
.bars .bar span{ display:block; height:100%; background:var(--accent); border-radius:4px; }
.seg2, .seg3{ display:flex; gap:6px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:4px; margin:0 0 12px; }
.seg2 button, .seg3 button{ flex:1; border:0; background:none; border-radius:10px; padding:9px 6px; font-weight:650; font-size:15px; color:var(--muted); }
.seg3 button span{ display:block; font-weight:400; font-size:12.5px; }
.seg2 button[aria-checked="true"], .seg3 button[aria-checked="true"]{ background:var(--accent-soft); color:var(--accent-ink); }

/* Buttons */
.primary{ display:block; width:100%; border:0; border-radius:14px; padding:15px 18px; background:var(--accent); color:var(--on-accent); font-weight:700; font-size:17px; }
.primary[disabled], .ghost[disabled]{ opacity:.45; cursor:default; }
.ghost{ border:1px solid var(--line); background:var(--surface); border-radius:14px; padding:13px 16px; font-weight:650; font-size:16px; color:var(--ink); }
.ghost.icon{ display:inline-flex; align-items:center; gap:8px; }
.ghost.rec.on{ color:var(--bad); border-color:var(--bad); }
.btnrow{ display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; align-items:center; }
.btnrow .primary{ flex:1 1 160px; width:auto; }
.btnrow.tight{ margin-top:4px; }
.link{ background:none; border:0; padding:4px 0; color:var(--accent-ink); text-decoration:underline; text-underline-offset:3px; font-size:inherit; }
.link.armed{ color:var(--bad); font-weight:650; }
.actionbar{ position:fixed; left:0; right:0; bottom:0; z-index:10; background:var(--bg); border-top:1px solid var(--line); padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px)); }
.actionbar .in{ max-width:620px; margin:0 auto; display:flex; gap:10px; }
.actionbar .primary{ flex:1; width:auto; }
.actionbar .ghost{ flex:0 1 auto; }

/* Übung */
.runbar{ display:flex; align-items:center; gap:12px; margin:6px 0 2px; }
.progress{ flex:1; display:flex; gap:3px; }
.seg{ flex:1; height:6px; border-radius:3px; background:var(--line); }
.seg.pass{ background:var(--accent); }
.seg.cur{ background:var(--muted); }
.count{ font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums; }
.count.grow{ flex:1; }
.topic{ font-size:14px; color:var(--muted); margin:6px 0 20px 52px; }
.kicker{ font-size:15px; color:var(--muted); margin:0 0 6px; }
.hintw{ display:inline-block; font-size:13.5px; color:var(--accent-ink); background:var(--accent-soft); border-radius:6px; padding:0 7px; margin-left:4px; }
.de{ font-family:var(--serif); font-size:23px; line-height:1.38; margin:0 0 16px; }
.big-de{ font-size:25px; margin-bottom:6px; }
.vocab{ font-size:15px; color:var(--muted); margin:-8px 0 14px; }
.gloss{ color:var(--muted); margin:4px 0 0; font-size:16px; }
.cloze{ font-family:var(--serif); font-size:20px; line-height:1.5; margin:0 0 12px; color:var(--accent-ink); }
.gapmark{ display:inline-block; min-width:4.5em; border-bottom:2px solid var(--accent); margin:0 2px; }
select, input[type="text"]{ width:100%; background:var(--surface); border:1.5px solid var(--line); border-radius:12px; padding:11px 13px; font-size:16px; }
input.tw{ font-family:var(--serif); font-size:20px; }
textarea{ display:block; width:100%; min-height:92px; resize:vertical; background:var(--surface); border:1.5px solid var(--line); border-radius:12px; padding:12px 13px; font-family:var(--serif); font-size:20px; line-height:1.4; }
input:focus, textarea:focus, select:focus{ border-color:var(--accent); outline:none; }
input.tw[readonly], textarea[readonly]{ background:transparent; border-style:dashed; }
.tiles-ans{ min-height:60px; border:1.5px dashed var(--line); border-radius:14px; padding:8px; display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
.tiles-ans .ph{ color:var(--faint); font-size:15px; margin:0 6px; }
.tiles-pool{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
.tile{ font-family:var(--serif); font-size:19px; padding:9px 13px; border-radius:11px; border:1px solid var(--line); background:var(--surface); color:var(--ink); box-shadow:0 1px 0 var(--line); }
.tiles-ans .tile{ background:var(--accent-soft); border-color:transparent; box-shadow:none; }
.tile[disabled]{ cursor:default; }
.chars{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.ch{ min-width:42px; height:40px; border:1px solid var(--line); background:var(--surface); border-radius:10px; font-family:var(--serif); font-size:19px; }
.verdict{ display:inline-block; font-weight:700; font-size:15px; padding:3px 11px; border-radius:999px; margin:0 0 10px; }
.v-ok{ background:var(--ok-soft); color:var(--ok); }
.v-mid{ background:var(--warn-soft); color:var(--warn); }
.v-bad{ background:var(--bad-soft); color:var(--bad); }
.yours{ font-family:var(--serif); font-size:18px; color:var(--muted); margin:0 0 8px; }
.yours s{ text-decoration-color:var(--bad); }
.solrow{ display:flex; align-items:flex-start; gap:10px; }
.sol{ font-family:var(--serif); font-size:21px; line-height:1.38; margin:0; flex:1; }
.expl{ font-size:16px; margin:10px 0 0; }
.more{ margin:6px 0 0; font-size:15px; color:var(--muted); }
.more summary{ cursor:pointer; color:var(--accent-ink); }
.more p{ margin:6px 0 0; }
.diff{ font-family:var(--serif); font-size:20px; line-height:1.55; margin:0 0 6px; }
.w-ok{ color:var(--ok); }
.w-near{ color:var(--warn); text-decoration:underline dotted; text-underline-offset:3px; }
.w-miss{ color:var(--bad); text-decoration:underline wavy; text-underline-offset:3px; }
.legend{ font-size:13.5px; color:var(--muted); margin:8px 0 0; }
.speak{ flex:none; width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--accent-ink); display:grid; place-items:center; padding:0; }
.speak.native{ background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
.ltlist{ list-style:none; padding:0; margin:12px 0 0; }
.ltlist li{ padding:8px 0; border-top:1px solid var(--line); font-size:15px; }
.ltlist mark{ background:var(--bad-soft); color:inherit; border-radius:3px; padding:0 3px; font-family:var(--serif); font-size:17px; }
.reps{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.rep{ font-family:var(--serif); font-size:16px; padding:4px 10px; border-radius:8px; border:1px solid var(--line); background:var(--ok-soft); color:var(--ok); }
.lt-ok{ color:var(--ok); font-weight:650; margin:12px 0 0; }

/* Sammeln */
.form label{ display:block; margin:0 0 14px; font-weight:650; font-size:15px; }
.form label input{ margin-top:6px; font-weight:400; }
.picklist{ margin-top:6px; }
.pickrow{ padding:0; }
.pickbtn{ flex:1; display:flex; align-items:center; gap:12px; text-align:left; background:none; border:0; padding:12px 16px; color:var(--ink); min-width:0; }
.pickrow .speak{ margin-right:12px; }
.check{ flex:none; width:22px; height:22px; border-radius:6px; border:2px solid var(--faint); }
.pickrow.on .check{ background:var(--accent); border-color:var(--accent); box-shadow:inset 0 0 0 3px var(--surface); }
.pickrow:not(.on) .rt{ color:var(--muted); }

/* Fertig */
.donebox{ padding:28px 2px 0; }
.done-h{ font-size:26px; font-weight:750; letter-spacing:-0.015em; margin:0 0 6px; }
.lead{ font-size:18px; margin:0 0 6px; }
.dots::after{ content:'…'; }
@media (prefers-reduced-motion: no-preference){ .dots::after{ display:inline-block; animation:blink 1.2s steps(4,end) infinite; width:1.2em; overflow:hidden; vertical-align:bottom; } }
@keyframes blink{ 0%{ width:0 } 100%{ width:1.2em } }

/* Fortschritt */
.weekgoal{ margin:14px 2px 0; }
.wdots{ display:flex; gap:8px; }
.wd{ display:flex; flex-direction:column; align-items:center; gap:3px; font-size:12px; color:var(--muted); width:28px; }
.wd i{ display:block; width:22px; height:22px; border-radius:50%; border:2px solid var(--line); }
.wd.on i{ background:var(--accent); border-color:var(--accent); }
.wd.now i{ border-color:var(--accent); }
.wd.fut{ opacity:.5; }
.wtext{ font-size:14.5px; color:var(--muted); margin:6px 0 0; }
.lenlink{ margin:8px 4px 0; }
.mbar{ height:8px; border-radius:4px; background:var(--line); overflow:hidden; }
.mbar span{ display:block; height:100%; background:var(--accent); border-radius:4px; }
.milestone{ display:inline-block; background:var(--accent-soft); color:var(--accent-ink); border-radius:10px; padding:8px 12px; font-weight:650; margin:8px 0 0; }
.kv .val{ flex:none; font-weight:700; font-variant-numeric:tabular-nums; text-align:right; max-width:45%; }
.chart{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 16px; }
.cal{ display:block; width:100%; height:auto; }
.cal text{ font-size:9px; fill:var(--muted); font-family:var(--sans); }
.cal .now{ stroke:var(--ink); stroke-width:1.5; }
.legend{ font-size:13px; color:var(--muted); margin:10px 0 0; line-height:1.8; }
.sq{ display:inline-block; width:11px; height:11px; border-radius:3px; vertical-align:-1px; margin:0 2px 0 6px; }
.legend .sq:first-of-type{ margin-left:4px; }
.barsvg{ display:block; width:100%; height:auto; }
.b-ok{ fill:var(--accent); } .sq.b-ok{ background:var(--accent); }
.b-bad{ fill:var(--bad); opacity:.75; } .sq.b-bad{ background:var(--bad); opacity:.75; }
.b-other{ fill:var(--faint); } .sq.b-other{ background:var(--faint); }
.axis{ stroke:var(--line); stroke-width:1; }
.axislbl{ display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:4px; }
.stack{ display:flex; height:14px; border-radius:7px; overflow:hidden; gap:2px; background:var(--line); }
.s-neu{ background:var(--line); } .s-aufbau{ background:color-mix(in srgb, var(--accent) 40%, var(--line)); } .s-sicher{ background:color-mix(in srgb, var(--accent) 75%, var(--line)); } .s-lang{ background:var(--accent); }
.stack .s-neu{ background:transparent; }
.distleg p{ margin:8px 0 0; font-size:14.5px; }
.distleg .sq{ margin:0 6px 0 0; }
.dim{ color:var(--muted); font-size:13px; }
.fc{ display:flex; gap:8px; align-items:flex-end; }
.fcd{ flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; }
.fcn{ font-size:13px; font-weight:650; font-variant-numeric:tabular-nums; }
.fcb{ width:100%; height:56px; display:flex; align-items:flex-end; background:var(--bg); border-radius:6px; overflow:hidden; }
.fcb span{ display:block; width:100%; background:var(--accent); border-radius:6px 6px 0 0; min-height:2px; }
.fcl{ font-size:12px; color:var(--muted); }
.setl{ font-size:14.5px; font-weight:650; margin:4px 4px 6px; }
.lbl-s{ font-family:var(--sans); font-size:14px; color:var(--muted); }
.w-extra{ color:var(--bad); text-decoration:line-through; text-decoration-thickness:2px; }

.cal rect{ cursor:pointer; }
.cal .fr{ stroke:var(--muted); stroke-width:1.2; stroke-dasharray:2 2; }
.sq.fr{ outline:1.2px dashed var(--muted); outline-offset:-1px; }
.cal .sel{ stroke:var(--ink); stroke-width:2; stroke-dasharray:none; }
.wd.free i{ border-style:dashed; border-color:var(--muted); }
.langhead{ margin:30px 0 14px; padding-top:18px; border-top:1px solid var(--line); }
.mchart{ display:flex; gap:4px; align-items:flex-end; }
.mc{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; min-width:0; }
.mcv{ font-size:11px; color:var(--muted); height:14px; font-variant-numeric:tabular-nums; }
.mcb{ width:100%; height:72px; display:flex; flex-direction:column-reverse; background:var(--bg); border-radius:5px; overflow:hidden; }
.mcl{ font-size:11.5px; color:var(--muted); }
.mc.now .mcl{ color:var(--ink); font-weight:700; }
.m-sv{ display:block; width:100%; background:var(--sv); } .sq.m-sv{ background:var(--sv); }
.m-es{ display:block; width:100%; background:var(--es); } .sq.m-es{ background:var(--es); }
.stat{ margin:0; font-size:15.5px; }
.stat b{ display:block; font-size:28px; font-weight:750; letter-spacing:-0.01em; margin-bottom:2px; }
.dimv{ font-weight:600; color:var(--muted); font-size:14px; }
.distleg .dim{ display:block; margin-left:17px; }
#app .cloze input.gapin:focus{ outline:none; background:var(--accent-soft); }
#app .cloze input.gapin[readonly]{ min-width:0;  background:transparent; border-style:solid; }
#app .cloze input.gapin.ok{ color:var(--ok); border-color:var(--ok); }
#app .cloze input.gapin.near{ color:var(--warn); border-color:var(--warn); }
#app .cloze input.gapin.bad{ color:var(--bad); border-color:var(--bad); text-decoration:line-through; }
.gapfix{ color:var(--ok); font-weight:600; }
.sol [data-a="lookup"]{ cursor:pointer; border-radius:3px; }
.sol [data-a="lookup"]:active{ background:var(--accent-soft); }
.recap{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:11px 14px; font-size:15px; margin:0 0 14px; }
.grprow{ display:flex; align-items:flex-end; justify-content:space-between; gap:10px; }
.minseg{ display:inline-flex; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:2px; margin:0 0 8px; }
.minseg button{ border:0; background:none; border-radius:999px; padding:5px 11px; font-size:13px; font-weight:650; color:var(--muted); }
.minseg button[aria-checked="true"]{ background:var(--accent-soft); color:var(--accent-ink); }
.s-anchored{ background:var(--accent); } .s-mature{ background:color-mix(in srgb, var(--accent) 70%, var(--line)); } .s-young{ background:color-mix(in srgb, var(--accent) 35%, var(--line)); }
.stack .s-neu{ background:transparent; }
.toggle .sw{ flex:none; width:44px; height:26px; border-radius:13px; background:var(--line); position:relative; transition:background .15s; }
.toggle .sw::after{ content:''; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:var(--surface); box-shadow:0 1px 2px rgba(0,0,0,.25); transition:left .15s; }
.toggle[aria-checked="true"] .sw{ background:var(--accent); }
.toggle[aria-checked="true"] .sw::after{ left:21px; }
button.row.toggle::after{ display:none; }

/* Feinschliff */
#fb:empty{ display:none; }
#fb{ margin-top:20px; padding:14px 16px 16px; border-radius:14px; background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--line); }
#fb.fb-ok{ border-left-color:var(--ok); }
#fb.fb-near{ border-left-color:var(--warn); }
#fb.fb-bad{ border-left-color:var(--bad); }
.eyebrow{ font-size:14px; color:var(--muted); margin:0 0 2px; font-weight:600; }
.today .num{ font-size:24px; }
.plan2{ list-style:none; padding:0; margin:12px 0 16px; }
.plan2 li{ display:flex; align-items:baseline; gap:8px; padding:8px 0; border-top:1px solid var(--line); font-size:16px; }
.plan2 li:first-child{ border-top:0; }
.plan2 b{ min-width:1.4em; text-align:right; font-variant-numeric:tabular-nums; }
/* Die Bezeichnung links bricht nie um, die Erklärung rechts darf umbrechen */
.plan2 li{ white-space:nowrap; }
.plan2 span{ color:var(--muted); font-size:14px; margin-left:auto; text-align:right; padding-left:12px; white-space:normal; min-width:0; }
.choices{ border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-top:4px; }
.choices .row{ background:var(--bg); }
.intro{ background:var(--accent-soft); border-radius:16px; padding:14px 16px 10px; margin:0 0 14px; font-size:15.5px; }
.intro p{ margin:0 0 6px; }
.intro .intro-h{ font-weight:700; }
.lead-s{ color:var(--muted); font-size:15px; margin:-6px 4px 16px; }
.grpnote{ font-size:13px; color:var(--muted); margin:0 4px 8px; }
.wleg{ font-size:13px; color:var(--muted); margin:4px 0 0; }
.wleg i{ display:inline-block; width:10px; height:10px; border:1.5px dashed var(--muted); border-radius:50%; vertical-align:-1px; margin:0 4px 0 6px; }
.topic-sp{ height:14px; }
.hintw{ margin-left:8px; }
.lenlink{ margin-top:10px; }
.weekgoal{ margin:16px 4px 0; }

/* Lücke: feste Mindestbreite für alle Lücken, wächst mit dem Text, bricht notfalls um */
#app input.gapin{ display:inline-block; box-sizing:border-box; vertical-align:baseline; width:150px; min-width:150px; max-width:100%; font-family:var(--serif); font-size:20px; line-height:1.3; color:var(--ink); background:var(--surface); border:0; border-bottom:2px solid var(--accent); border-radius:6px 6px 0 0; padding:3px 10px; margin:2px 3px; }
.gapmeasure{ position:absolute; left:-9999px; top:0; visibility:hidden; white-space:pre; font-family:var(--serif); font-size:20px; padding:0; }
.cloze{ line-height:1.9; }
.x.xt{ font-size:14.5px; font-weight:600; padding:0 8px 0 2px; color:var(--muted); background:none; border:0; min-width:0; }
.notice{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
.notice .link{ flex:none; font-weight:650; }
.armnote{ display:block; font-size:13px; color:var(--bad); margin-top:2px; }
.row.static .link + .armnote{ text-align:right; }
.setl-n{ font-size:13px; color:var(--muted); margin:-4px 4px 8px; }
.topic{ margin-left:0; }
button.row[disabled]::after{ display:none; }

@supports (field-sizing: content){
  #app input.gapin{ field-sizing:content; width:auto; }
  #app .cloze input.gapin[readonly]{ min-width:2ch; }
}
/* Wörterbuch-Popup */
.popov{ position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:60; }
.pop{ position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); z-index:61; max-width:536px; margin:0 auto; background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px 18px 12px; box-shadow:0 10px 30px rgba(0,0,0,.35); }
.pophead{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.popw{ font-family:var(--serif); font-size:24px; color:var(--accent-ink); }
.popl{ margin:6px 0 0; color:var(--muted); font-size:15px; }
.popl b{ color:var(--ink); font-family:var(--serif); font-weight:600; }
.popde{ margin:6px 0 2px; font-size:17px; line-height:1.45; }
.popweb{ margin:8px 0 2px; padding-left:18px; font-size:15px; }
.popweb li{ margin:2px 0; }
.pop .go{ margin-top:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:12px; padding:9px 14px; font-weight:650; }
.popfoot{ display:flex; justify-content:space-between; align-items:center; margin-top:12px; gap:10px; }
.popfoot .ghost{ min-height:40px; padding:0 16px; }
.w-moved{ color:var(--bad); text-decoration:underline wavy; text-decoration-thickness:1.5px; text-underline-offset:4px; }
.lbl-s{ font-family:var(--sans); font-size:14px; color:var(--muted); }

/* Wortkästchen */
.tile{ touch-action:manipulation; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
.tile.ghost{ background:transparent; color:transparent; border:1px dashed var(--line); box-shadow:none; }
.tiles-ans{ align-content:flex-start; }
.tiles-ans .tile.ok{ background:color-mix(in srgb, var(--ok) 18%, var(--surface)); color:var(--ink); }
.tiles-ans .tile.moved{ background:color-mix(in srgb, var(--bad) 18%, var(--surface)); color:var(--bad); }
.tiles-ans .tile.extra{ background:transparent; border:1px dashed var(--bad); color:var(--bad); text-decoration:line-through; }
.tile, .tile.ghost, .tile[disabled]{ font-weight:400; }

/* Übungstage: gefüllt = Tagwerk, kräftiger = mehr, Ring = nur etwas geübt */
.cal .c0, .sq.c0{ fill:var(--line); background:var(--line); }
.cal .c1{ fill:var(--surface); stroke:var(--ok); stroke-width:1.6; }
.sq.c1{ background:transparent; box-shadow:inset 0 0 0 1.6px var(--ok); }
.cal .c2, .sq.c2{ fill:color-mix(in srgb, var(--ok) 62%, var(--bg)); background:color-mix(in srgb, var(--ok) 62%, var(--bg)); }
.cal .c3, .sq.c3{ fill:var(--ok); background:var(--ok); }
.sq.c0.fr{ background:transparent; box-shadow:inset 0 0 0 1.2px var(--muted); border:0; outline:1.2px dashed var(--muted); outline-offset:-1.2px; box-shadow:none; }
.calleg{ display:flex; flex-wrap:wrap; gap:4px 14px; }
.calleg span{ display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
.calleg .sq{ margin:0; }
.wd.some i, .wleg i.half{ border-color:var(--accent); border-style:solid; background:linear-gradient(to top, var(--accent) 50%, transparent 50%); }
.rtrend{ display:flex; gap:6px; align-items:flex-end; height:96px; margin:14px 0 6px; }
.rtw{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; height:100%; }
.rtn{ font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; min-height:14px; }
.rtb{ flex:1; width:100%; max-width:26px; display:flex; align-items:flex-end; background:color-mix(in srgb, var(--line) 50%, transparent); border-radius:5px; overflow:hidden; }
.rtb > span{ display:block; width:100%; background:var(--ok); border-radius:5px 5px 0 0; }
.rtb.low > span{ background:var(--warn); }
.rtb.none{ background:transparent; border:1px dashed var(--line); }
.rtl{ font-size:10px; color:var(--faint); white-space:nowrap; }

/* Diagramme */
.rtsvg, .pcsvg{ display:block; width:100%; height:auto; margin:10px 0 4px; overflow:visible; }
.rtsvg .gl, .pcsvg .gl{ stroke:var(--line); stroke-width:1; }
.rtsvg text, .pcsvg text{ font-family:var(--sans); font-size:9.5px; fill:var(--muted); }
.rtsvg .yl, .pcsvg .yl{ text-anchor:end; }
.rtsvg .xl, .rtsvg .vl{ text-anchor:middle; }
.rtsvg .xl, .pcsvg .xl{ fill:var(--faint); }
.rtsvg .vl{ fill:var(--ink); font-variant-numeric:tabular-nums; }
.rtsvg .bo{ fill:var(--ok); } .rtsvg .bw{ fill:var(--warn); } .rtsvg .bn{ fill:var(--line); }
.rtsvg .tgt{ stroke:var(--ink); stroke-width:1; stroke-dasharray:4 3; opacity:.55; }
.tgtl{ display:inline-block; width:16px; border-top:1.5px dashed var(--ink); opacity:.55; vertical-align:middle; margin-right:6px; }
.pcsvg path{ fill:none; stroke-linejoin:round; stroke-linecap:round; }
.ln-n{ stroke:var(--faint); stroke-width:2; }
.ln-k{ stroke:var(--accent); stroke-width:2; stroke-dasharray:5 3; }
.ln-m{ stroke:var(--ok); stroke-width:2.6; }
.pcsvg .el{ font-weight:700; font-size:10.5px; }
.pcsvg .el.ln-n{ fill:var(--muted); stroke:none; } .pcsvg .el.ln-k{ fill:var(--accent-ink); stroke:none; } .pcsvg .el.ln-m{ fill:var(--ok); stroke:none; }
.lk{ display:inline-block; width:18px; height:0; border-top:2.5px solid; vertical-align:middle; }
.lk.ln-n{ border-color:var(--faint); } .lk.ln-k{ border-top-style:dashed; border-color:var(--accent); } .lk.ln-m{ border-color:var(--ok); }
.mc.unm .mcv{ color:var(--faint); }
.vrow{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.nexthint{ font-size:13.5px; color:var(--muted); }
.wordrow{ font-family:var(--serif); }
.wordrow [data-a="lookup"]{ cursor:pointer; }

.legend .sq.m-sv, .legend .sq.m-es{ display:inline-block; width:10px; height:10px; border-radius:3px; vertical-align:-1px; margin-right:4px; }
.rtsvg .vl.in{ fill:var(--bg); font-weight:700; }

/* Kopfzeile mit Einstellungen */
.topline{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.iconbtn{ flex:none; width:42px; height:42px; display:grid; place-items:center; border-radius:50%; border:0; background:none; color:var(--muted); }
.iconbtn:active{ background:var(--surface); }
/* Fundstück */
.find{ margin:22px 0 0; padding:14px 16px; border-radius:16px; border:1px solid var(--line); background:var(--surface); }
.find-k{ margin:0 0 4px; font-size:13px; font-weight:600; color:var(--muted); }
.find-h{ margin:0; font-size:18px; font-weight:650; line-height:1.35; }
.find-h .wordrow{ font-weight:600; color:var(--accent-ink); }
.find-de{ font-family:var(--serif); font-weight:500; }
.find-d{ font-weight:500; color:var(--muted); font-size:15px; }
.find-t{ margin:6px 0 0; font-size:15px; line-height:1.45; color:var(--ink); }
.find-p{ display:flex; align-items:center; flex-wrap:wrap; gap:4px 10px; margin-top:10px; }
.find-p .wordrow{ font-size:19px; color:var(--accent-ink); }
.find-g{ font-size:14px; color:var(--muted); }
.find .link{ margin-top:8px; }
.fc.empty{ display:none; }
/* Bewegung: kurz, nur wo sie Orientierung gibt */
@keyframes fbIn{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
@keyframes popIn{ from{ opacity:0; transform:translateY(18px); } to{ opacity:1; transform:none; } }
@keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
#fb.enter{ animation:fbIn .18s ease-out; }
.pop{ animation:popIn .18s ease-out; }
.popov{ animation:fadeIn .15s ease-out; }
.find-p.reveal{ animation:fadeIn .2s ease-out; }
.tile, .primary, .ghost{ transition:transform .08s ease-out; }
.tile:not([disabled]):active, .primary:not([disabled]):active, .ghost:not([disabled]):active{ transform:scale(.96); }
@media (prefers-reduced-motion: reduce){ *, *::before, *::after{ animation:none !important; transition:none !important; } }

.years{ width:100%; border-collapse:collapse; margin:10px 0 2px; font-size:14px; font-variant-numeric:tabular-nums; }
.years th{ text-align:left; font-weight:600; color:var(--muted); font-size:12.5px; padding:4px 6px 4px 0; border-bottom:1px solid var(--line); }
.years td{ padding:5px 6px 5px 0; border-bottom:1px solid var(--line); }
.years tr:last-child td{ border-bottom:0; }
.years th:not(:first-child), .years td:not(:first-child){ text-align:right; }
.notice .link.dim{ color:var(--muted); font-weight:500; }

/* Symbole */
.ico{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex:none; }
.row.has-ico{ gap:14px; }
.rico{ flex:none; width:38px; height:38px; border-radius:11px; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent-ink); }
.row[disabled] .rico{ background:var(--line); color:var(--muted); }
#tabs button{ display:flex; flex-direction:column; align-items:center; gap:2px; font-size:12.5px; padding-top:7px; padding-bottom:7px; }
#tabs .ico{ width:21px; height:21px; }
/* Begrüßung */
.hello{ margin:6px 4px 14px; }
.hello-g{ margin:0; font-family:var(--serif); font-size:27px; line-height:1.2; color:var(--accent-ink); }
.hello-d{ margin:2px 0 0; font-size:14px; color:var(--muted); }
/* Hauptkarte in der Farbe der Sprache */
.today.hero{ background:linear-gradient(155deg, color-mix(in srgb, var(--accent) 14%, var(--surface)) 0%, var(--surface) 62%); border-color:color-mix(in srgb, var(--accent) 25%, var(--line)); }
/* Mikrofon */
.inrow{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
.inrow .chars{ flex:1; }
.micbtn{ flex:none; width:46px; height:46px; border-radius:50%; display:grid; place-items:center; border:1px solid var(--line); background:var(--surface); color:var(--accent-ink); margin-top:10px; }
.micbtn.on, .micb.on{ background:var(--accent); color:var(--bg); border-color:var(--accent); animation:micPulse 1.2s ease-in-out infinite; }
.micb .ico{ margin-right:6px; vertical-align:-5px; }
@keyframes micPulse{ 0%, 100%{ box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); } 50%{ box-shadow:0 0 0 8px color-mix(in srgb, var(--accent) 0%, transparent); } }
/* Aussprache */
.pron{ margin-top:14px; padding:12px 14px; border-radius:14px; background:var(--surface); border:1px solid var(--line); }
.pron-s{ margin:0 0 6px; font-family:var(--serif); font-size:21px; line-height:1.5; }
.pron-s .p-ok{ color:var(--ok); }
.pron-s .p-miss{ color:var(--warn); text-decoration:underline wavy; text-underline-offset:5px; text-decoration-thickness:1.5px; }
/* Stempel nach dem Tagwerk */
.stamp{ width:56px; height:56px; display:block; margin:4px 0 10px; fill:none; stroke:var(--ok); stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
.stamp circle{ stroke-width:2.5; opacity:.9; }
.stamp.draw circle{ stroke-dasharray:158; stroke-dashoffset:158; animation:drawIt .45s ease-out forwards; }
.stamp.draw path{ stroke-dasharray:40; stroke-dashoffset:40; animation:drawIt .3s .38s ease-out forwards; }
@keyframes drawIt{ to{ stroke-dashoffset:0; } }
@media (prefers-reduced-motion: reduce){ .stamp.draw circle, .stamp.draw path{ stroke-dashoffset:0; } }

/* Fehler finden */
.spot{ font-family:var(--serif); font-size:22px; line-height:1.9; margin:10px 0 0; }
.sw-w{ font:inherit; color:var(--accent-ink); background:none; border:0; padding:1px 4px; margin:0 -2px; border-radius:7px; border-bottom:1.5px dotted color-mix(in srgb, var(--accent) 45%, transparent); transition:background-color .2s, color .2s; }
.sw-w:not([disabled]):active{ background:var(--accent-soft); }
.sw-w[disabled]{ color:var(--ink); border-bottom-color:transparent; cursor:default; }
.sw-w.hit{ background:color-mix(in srgb, var(--ok) 22%, transparent); color:var(--ok); }
.sw-w.miss{ background:color-mix(in srgb, var(--bad) 20%, transparent); color:var(--bad); text-decoration:line-through; }
.sw-w.was{ outline:1.5px dashed var(--bad); outline-offset:1px; color:var(--bad); }
.sol .w-fix{ color:var(--ok); font-weight:700; }
/* Genus */
.genus{ text-align:center; margin:18px 0 6px; }
.genus-w{ font-family:var(--serif); font-size:40px; line-height:1.1; margin:0; color:var(--ink); }
.genus-de{ margin:6px 0 0; color:var(--muted); font-size:15px; }
.genus-opts{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:22px 0 0; }
.genus-o{ font-family:var(--serif); font-size:26px; padding:18px 0; border-radius:16px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); transition:background-color .2s, border-color .2s, transform .08s; }
.genus-o:not([disabled]):active{ transform:scale(.97); }
.genus-o.right{ background:color-mix(in srgb, var(--ok) 22%, var(--surface)); border-color:var(--ok); color:var(--ok); }
.genus-o.wrong{ background:color-mix(in srgb, var(--bad) 18%, var(--surface)); border-color:var(--bad); color:var(--bad); }
/* Uhrzeiten & Zahlen */
.clockbig{ font-size:40px; font-weight:700; letter-spacing:.02em; margin:6px 0 14px; font-variant-numeric:tabular-nums; }
.numin{ font-size:24px; font-variant-numeric:tabular-nums; max-width:220px; }
/* Neue Aufgabe erscheint ruhig */
.spot.enter, .genus.enter{ animation:fadeIn .18s ease-out; }

/* Fortschritt: Reiter und Sprachübersicht */
.ptabs{ display:grid; grid-template-columns:repeat(3, 1fr); gap:4px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:4px; margin:0 0 16px; }
.ptabs button{ border:0; background:none; border-radius:10px; padding:9px 0; font-size:14.5px; font-weight:650; color:var(--muted); }
.ptabs button[aria-selected="true"]{ background:var(--accent-soft); color:var(--accent-ink); }
.langsums{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.langsum{ text-align:left; display:flex; flex-direction:column; gap:2px; padding:14px; border-radius:16px; border:1px solid var(--line); background:var(--surface); color:var(--ink); }
.ls-h{ font-size:13px; font-weight:650; color:var(--muted); }
.ls-n{ font-size:30px; font-weight:750; line-height:1.1; font-variant-numeric:tabular-nums; }
.ls-l{ font-size:13.5px; color:var(--muted); }
.ls-s{ font-size:13px; color:var(--faint); margin-top:4px; }
.row.tline{ display:grid; grid-template-columns:1fr 64px 44px; align-items:center; gap:10px; padding-top:11px; padding-bottom:11px; }
.row.tline .tl{ font-size:15px; font-weight:600; text-align:left; }
.bar.mini{ height:6px; }
.row.tline .tv{ font-size:13px; color:var(--muted); text-align:right; font-variant-numeric:tabular-nums; }
.link.inl{ font-size:inherit; padding:0; }
/* Themenblatt und Listen */
.pop.tall{ max-height:78vh; overflow-y:auto; }
.pop-h{ margin:0 0 6px; font-size:20px; font-weight:700; }
.pop-t{ margin:6px 0 0; font-size:15px; line-height:1.5; color:var(--ink); }
.pop-sub{ margin:14px 0 4px; font-size:13px; font-weight:650; color:var(--muted); }
.exl{ list-style:none; margin:0; padding:0; }
.exl li{ display:flex; flex-direction:column; padding:6px 0; border-top:1px solid var(--line); }
.exl li:first-child{ border-top:0; }
.exl .wordrow, .exl .exs{ font-family:var(--serif); font-size:17px; }
.exg{ font-size:13.5px; color:var(--muted); }
.errx{ margin:0; font-family:var(--serif); font-size:17px; color:var(--muted); }
.errx .w-bad{ color:var(--bad); text-decoration:line-through; }
.okx{ margin:2px 0 0; font-family:var(--serif); font-size:17px; color:var(--ok); }
.more-l{ margin-top:6px; }
.find-more{ display:inline-block; margin-top:8px; font-size:14px; }
.ffrow .rt .wordrow{ font-family:var(--serif); color:var(--accent-ink); }
.feast .rd{ margin-top:2px; }
.feast-p{ display:block; margin-top:4px; }
.feast-p .wordrow{ font-family:var(--serif); color:var(--accent-ink); }

/* Fachbegriffe */
.term{ font:inherit; color:inherit; background:none; border:0; padding:0; text-decoration:underline dotted; text-decoration-thickness:1.5px; text-underline-offset:3px; text-decoration-color:color-mix(in srgb, var(--accent) 70%, transparent); cursor:pointer; }
.term:active{ background:var(--accent-soft); border-radius:3px; }
.termex{ margin:0; font-family:var(--serif); font-size:16.5px; line-height:1.5; }
/* Kalender: feste Kästchen, nach rechts wischen für früher */
.calwrap{ display:flex; gap:4px; align-items:flex-start; }
.calscroll{ overflow-x:auto; overflow-y:hidden; scrollbar-width:none; -webkit-overflow-scrolling:touch; flex:1; }
.calscroll::-webkit-scrollbar{ display:none; }
.calscroll .cal, .cal.cal-days{ width:auto; max-width:none; flex:none; display:block; }
/* Mengenwahl */
.row.chiprow{ display:flex; align-items:center; gap:12px; cursor:default; }
.row.chiprow::after{ display:none; }
.chips{ display:flex; gap:6px; flex:none; }
.chip{ min-width:44px; height:40px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--accent-ink); font-weight:700; font-size:15px; font-variant-numeric:tabular-nums; }
.chip:active{ transform:scale(.95); background:var(--accent-soft); }

/* Land & Leute */
.kvars{ display:grid; gap:6px; margin:10px 0 2px; }
.kv{ display:grid; grid-template-columns:28px auto 1fr; align-items:baseline; gap:8px; }
.kf{ font-size:19px; line-height:1; }
.kw{ font-family:var(--serif); font-size:17px; color:var(--accent-ink); white-space:nowrap; }
.kr{ font-size:13px; color:var(--muted); }
.kfoot{ margin:10px 0 0; }
.kown{ font-size:14px; color:var(--ok); }
.find.kcard{ margin-bottom:10px; }
/* Fehlerquellen */
.errseg{ margin-bottom:12px; }
.erows{ display:grid; gap:4px; }

const ADJS = {

};
const DE_ART = { m:['ein','der','er'], f:['eine','die','e'], n:['ein','das','es'] };
function svForms(f){ return { base:f[0], t:f[1], a:f[2], defSg:f[3] || f[2], pl:f[4] || f[2] }; }
function genNP(){
  const N = pick(NOUNS);
  const [de, g, dePl, sv, art, def, pl, defPl, allowed] = N;
  const key = pick(allowed.split(''));
  const A = ADJS[key];
  const forms = [A[2]].concat(A[3] || []).map(svForms);
  const ett = art === 'ett';
  const type = pick(['indef', 'def', 'def', 'pl', 'defpl', 'defpl', 'pred', 'predpl']);
  const da = DE_ART[g];
  let prompt, answers, note;
  switch (type) {
    case 'indef':
      prompt = `${da[0]} ${A[1]}${da[2]} ${de}`;
      answers = forms.map(f => `${art} ${ett ? f.t : f.base} ${sv}`);
      note = `${sv} ist ein ${art}-Wort, also ${ett ? 't-Form des Adjektivs' : 'Grundform des Adjektivs'}.`;
      break;
    case 'def':
      prompt = `${da[1]} ${A[1]}e ${de}`;
      answers = forms.map(f => `${ett ? 'det' : 'den'} ${f.defSg} ${def}`);
      note = `Doppelte Bestimmtheit: ${ett ? 'det' : 'den'} + Adjektiv auf -a + bestimmte Form (${def}).`;
      break;
    case 'pl':
      prompt = `${A[1]}e ${dePl}`;
      answers = forms.map(f => `${f.pl} ${pl}`);
      note = `Plural unbestimmt: Adjektiv auf -a, Substantiv im Plural (${pl}).`;
      break;
    case 'defpl':
      prompt = `die ${A[1]}en ${dePl}`;
      answers = forms.map(f => `de ${f.pl} ${defPl}`);
      note = `Doppelte Bestimmtheit im Plural: de + Adjektiv auf -a + ${defPl}.`;
      break;
    case 'pred':
      prompt = `${capFirst(da[1])} ${de} ist ${A[0]}.`;
      answers = forms.map(f => `${capFirst(def)} är ${ett ? f.t : f.base}.`);
      note = `Auch nach „är“ passt sich das Adjektiv an: ${sv} ist ein ${art}-Wort.`;
      break;
    default:
      prompt = `Die ${dePl} sind ${A[0]}.`;
      answers = forms.map(f => `${capFirst(defPl)} är ${f.pl}.`);
      note = `Nach „är“ im Plural: Adjektiv auf -a (${forms[0].pl}).`;
  }
  return { prompt, answers, note, label:'Übersetze ins Schwedische' };
}

    [1, () => { const a = pick(SE_PROF), pl = s.p >= 3, f = s.g === 'f'; return [`${s.es} ___ ${a[(pl ? 2 : 0) + (f ? 1 : 0)]}.`, `${s.de} ${SEIN[s.p]} ${a[4 + (pl ? 2 : 0) + (f ? 1 : 0)]}.`, SER[s.p], 'Beruf: ser, und zwar ohne Artikel.']; }],
    [0.8, () => { const a = pick(SE_FROM); return [`${s.es} ___ de ${a[0]}.`, `${s.de} ${KOMMEN[s.p]} aus ${a[1]}.`, SER[s.p], 'Herkunft: ser de. Auch wenn man im Deutschen „kommen aus“ sagt.']; }],
    [1.4, () => { const a = pick(SE_LOC); return [`${s.es} ___ ${a[0]}.`, `${s.de} ${SEIN[s.p]} ${a[1]}.`, ESTAR[s.p], 'Wo sich jemand befindet: estar.']; }],
    [0.9, () => { const e = pick(SE_EVENT), l = pick(e[2]); return [`${e[0]} ___ ${l}.`, `${e[1]} ist ${SE_EVLOC[l]}.`, 'es', 'Wo ein Ereignis stattfindet: ser, nicht estar.']; }],
    [0.8, () => { const t = pick(SE_TIME); return [t[0], t[1], t[2], 'Uhrzeit, Tag und Datum: ser.']; }],
    [1.3, () => { const t = pick(SE_RESULT), adj = pick(t[4]); const f = t[2] === 'f' ? adj.replace(/o$/, 'a') : adj; return [`${t[0]} ___ ${t[3] ? plEs(f) : f}.`, `${t[1]} ${t[3] ? 'sind' : 'ist'} ${SE_RES_DE[adj]}.`, t[3] ? 'están' : 'está', 'Zustand als Ergebnis (offen, geschlossen, schmutzig): estar.']; }],

  let r = Math.random() * frames.reduce((a, f) => a + f[0], 0), fr = frames[0][1];

const spotData = (de, wrongWords, wrongIdx, fixed, note, trap) => ({ kind:'spot', deLine:de, words:wrongWords, wrong:wrongIdx, full:fixed, answers:[fixed], note, trap, label:'Finde den Fehler' });

  const rest = vp[1] ? vp[1].split(' ') : [];

  if (roll < 0.45) {

    const head = intro[0].split(' ');
    const right = head.concat([s[0], adv, vp[0]], rest), wrong = head.concat([s[0], vp[0], adv], rest);
    return spotData(`${intro[1]} ${fill(vp[5])}.`, wrong, [head.length + 1, head.length + 2], right.join(' ') + '.', `Im Nebensatz steht „${adv}“ vor dem Verb: … ${s[0]} ${adv} ${vp[0]}.`, 'bisats');
  }
  if (roll < 0.75) {
    const front = vp[6].split(' ');
    const right = front.concat([vp[0], s[0], adv], rest), wrong = front.concat([s[0], vp[0], adv], rest);
    return spotData(`${vp[7]} ${fill(vp[4].replace('{S} {V}', '{V} {s}'))}.`, wrong, [front.length, front.length + 1], right.join(' ') + '.', `Steht etwas anderes vorn, kommt erst das Verb, dann das Subjekt: ${vp[6]} ${vp[0]} ${s[0]}.`, 'inversion');
  }

  const right = [S0, vp[0], adv].concat(rest), wrong = [S0, adv, vp[0]].concat(rest);
  return spotData(`${fill(vp[4])}.`, wrong, [1, 2], right.join(' ') + '.', `Im Hauptsatz steht „${adv}“ nach dem Verb. Vor dem Verb steht es nur im Nebensatz.`, 'bisats');
}

const SE_SWAP = { soy:'estoy', eres:'estás', es:'está', somos:'estamos', son:'están', estoy:'soy', estás:'eres', está:'es', estamos:'somos', están:'son' };
function spotSwapEs(gen, swap, trap){

// Spanisch: Subjuntivo und Indefinido aus der Satzbank
const HABER = ['he', 'has', 'ha', 'hemos', 'han'];
const PART_IRR = { hacer:'hecho', decir:'dicho', ver:'visto', escribir:'escrito', poner:'puesto', volver:'vuelto', abrir:'abierto', romper:'roto', morir:'muerto', leer:'leído', traer:'traído', caer:'caído', oír:'oído' };
const participle = inf => PART_IRR[inf] || (inf.endsWith('ar') ? inf.slice(0, -2) + 'ado' : inf.slice(0, -2) + 'ido');
function bankSpotsEs(){
  const out = [];
  BANK.es.forEach(it => {
    if (!it.gap || it.gap.includes(' ') || !it.hint) return;
    // Relativsätze wie „un piso que tiene/tenga“ sind je nach Lesart beides: nicht als Fehler verwenden
    if (/\b(un|una|unos|unas) \S+ que\b/.test(it.target)) return;
    const inf = it.hint.replace(/[()]/g, '').split(',')[0].trim();
    if (!/^[a-zñ]+(ar|er|ir)$/.test(inf)) return;
    const toks = it.target.split(' '), idx = toks.findIndex(t => t.replace(/[.,!?¿¡]/g, '') === it.gap);
    if (idx < 0) return;
    const swapAt = (form, extra) => { const w = toks.slice(); w[idx] = toks[idx].replace(it.gap, form); if (extra) w.splice(idx + 1, 0, extra); return w; };
    if (it.trap === 'subjuntivo') {
      // yo und él/ella haben im Subjuntivo dieselbe Form: im Zweifel dritte Person, außer der deutsche Satz sagt „ich“
      const cands = [0, 1, 2, 3, 4].filter(k => conjugate(inf, 'subj', k) === it.gap);
      if (!cands.length) return;
      const p = cands.includes(2) && cands.includes(0) ? (/\b(dass|wenn|bevor|damit|ob) ich\b/.test(it.de) ? 0 : 2) : cands[0];
      const ind = conjugate(inf, 'pres', p);
      if (!ind || ind === it.gap) return;
      out.push(() => spotData(it.de, swapAt(ind), [idx], it.target, 'Hier verlangt der Satz den Subjuntivo, etwa nach querer que, es importante que, ojalá, para que oder cuando mit Zukunftsbezug.', 'subjuntivo'));
    }
    if (it.trap === 'perfecto' && /\b(ayer|pasado|pasada|anoche|en \d{4}|\d{4})\b/i.test(it.target)) {
      const p = [0, 1, 2, 3, 4].find(k => conjugate(inf, 'indef', k) === it.gap);
      if (p == null) return;
      out.push(() => spotData(it.de, swapAt(HABER[p], participle(inf)), [idx, idx + 1], it.target, 'Mit einem abgeschlossenen Zeitpunkt (ayer, la semana pasada, 2015) steht Indefinido, nicht Perfecto.', 'perfecto'));
    }
  });
  return out;
}
let BANK_SPOTS_ES = null;
function genSpotSv(){ const r = Math.random(); return r < 0.5 ? spotInteSv() : r < 0.75 ? spotTempusSv() : spotNpSv(); }
function genSpotEs(){
  if (!BANK_SPOTS_ES) BANK_SPOTS_ES = bankSpotsEs();
  const r = Math.random();
  if (r < 0.3 && BANK_SPOTS_ES.length) return pick(BANK_SPOTS_ES)();
  if (r < 0.65) return spotSwapEs(genSerEstar, a => SE_SWAP[a] || a, 'serestar');
  return spotSwapEs(genPorPara, a => (a === 'por' ? 'para' : 'por'), 'porpara');
}

function genTransEs(){
  const r = Math.random();

    const [inf, comp] = pick(ES_VP), [subj, p] = pick(ES_SUBJ), trig = pick(ES_TRIG);
    const pres = conjugate(inf, 'pres', p), subjF = conjugate(inf, 'subj', p);

    const ans = `${trig} ${subj ? subj.toLowerCase() === 'los niños' ? 'los niños ' : subj + ' ' : ''}${subjF} ${comp}.`;

function timeWords(lang, h, m){
  const n = h % 12 || 12, nx = (h % 12) + 1;
  if (lang === 'sv') {
    const H = SV_H[n], X = SV_H[nx];
    const map = { 0:[`klockan ${H}`, H], 5:[`fem över ${H}`], 10:[`tio över ${H}`], 15:[`kvart över ${H}`], 20:[`tjugo över ${H}`, `tio i halv ${X}`], 25:[`fem i halv ${X}`], 30:[`halv ${X}`], 35:[`fem över halv ${X}`], 40:[`tjugo i ${X}`, `tio över halv ${X}`], 45:[`kvart i ${X}`], 50:[`tio i ${X}`], 55:[`fem i ${X}`] };
    return map[m];
  }
  const art = k => (k === 1 ? 'la' : 'las'), verb = k => (k === 1 ? 'Es' : 'Son');
  const H = `${art(n)} ${ES_H[n]}`, X = `${art(nx)} ${ES_H[nx]}`;
  const map = { 0:[H], 5:[`${H} y cinco`], 10:[`${H} y diez`], 15:[`${H} y cuarto`], 20:[`${H} y veinte`], 25:[`${H} y veinticinco`], 30:[`${H} y media`], 35:[`${X} menos veinticinco`], 40:[`${X} menos veinte`], 45:[`${X} menos cuarto`], 50:[`${X} menos diez`], 55:[`${X} menos cinco`] };

  return forms.concat(forms.map(f => `${v.toLowerCase()} ${f}`));

function genTime(lang){
  const isTime = Math.random() < 0.65;
  const canHear = canSpeak() && voiceFor(lang);
  const dirRoll = Math.random(), dir = dirRoll < 0.5 ? 'read' : dirRoll < 0.72 && canHear ? 'hear' : 'write';
  if (isTime) {
    const h = 1 + Math.floor(Math.random() * 12), m = pick([0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55]);
    const words = timeWords(lang, h, m), clock = `${h}:${String(m).padStart(2, '0')}`;
    const say = lang === 'sv' ? `Klockan är ${words[0].replace(/^klockan /, '')}.` : `${m >= 35 ? (((h % 12) + 1) === 1 ? 'Es' : 'Son') : (h % 12 === 1 ? 'Es' : 'Son')} ${words[0]}.`;

// Uhrzeit-Eingabe tolerant prüfen: 7:45, 7.45, 7,45, „7 45“, 7h45 und 745 oder 0745 ohne Trennzeichen sind gleich.
// Die Zifferntastatur auf dem Handy hat oft keinen Doppelpunkt, darum zählt jedes übliche Trennzeichen.
function timeMatches(input, h, m){
  const v = String(input).trim();
  const x = v.match(/^(\d{1,2})\s*[:.,h ]\s*(\d{2})$/) || v.match(/^(\d{1,2})(\d{2})$/) || v.match(/^(\d{1,2})$/);
  if (!x) return false;
  const hh = Number(x[1]), mm = x[2] != null ? Number(x[2]) : 0;
  return mm === m && (hh % 12 || 12) === (h % 12 || 12);
}

// Wo führt das Deutsche in die Irre? Schwedisch: das → ett, der/die → en (Faustregel, die oft trügt). Spanisch: der → el, die → la
function genusHint(lang, item){
  const [w, g, de, extra] = item, dart = de.split(' ')[0];
  if (lang === 'sv') {
    const guess = dart === 'das' ? 'ett' : 'en';
    return guess !== g ? `Deutsch ${de}, aber ${g} ${w}.` : '';
  }
  const guess = dart === 'der' ? 'el' : dart === 'die' ? 'la' : '';
  const contrast = guess && guess !== g ? `Deutsch ${de}, aber ${g} ${w}.` : '';
  return [contrast, extra || ''].filter(Boolean).join(' ');
}
function genGenus(lang){
  const list = GENUS[lang], st = (DB.genus && DB.genus[lang]) || {};
  // Wörter, die zuletzt falsch waren, kommen öfter
  const weak = list.filter(x => st[x[0]] && st[x[0]].last === 0);
  const item = weak.length && Math.random() < 0.4 ? pick(weak) : pick(list);
  const opts = lang === 'sv' ? ['en', 'ett'] : ['el', 'la'];
  return { kind:'genus', word:item[0], answer:item[1], options:opts, deLine:item[2], answers:[item[1]], full:`${item[1]} ${item[0]}`, note:genusHint(lang, item), label:lang === 'sv' ? 'en oder ett?' : 'el oder la?', trap:'genus' };
}

const SV_VERB_DE = { äta:'essen', dricka:'trinken', skriva:'schreiben', läsa:'lesen', se:'sehen', gå:'gehen', komma:'kommen', göra:'machen', ta:'nehmen', köpa:'kaufen', träffa:'treffen', springa:'laufen, rennen', flyga:'fliegen', simma:'schwimmen', vinna:'gewinnen', glömma:'vergessen', ringa:'anrufen', hitta:'finden', sjunga:'singen', få:'bekommen; dürfen', sova:'schlafen', åka:'fahren' };
let GLOSS = { sv:{}, es:{} };
function buildGloss(){
  GLOSS = { sv:{}, es:{} };
  const put = (lang, form, lemma, de, gen) => {
    form = String(form || '').toLowerCase().trim();
    if (!form) return;
    const cur = GLOSS[lang][form];
    if (!cur) { GLOSS[lang][form] = { l:lemma && lemma.toLowerCase() !== form ? lemma : '', de, gen:!!gen }; return; }
    if (!(cur.gen && gen) || cur.de.includes(de)) return;
    if (lemma && cur.l && lemma !== cur.l) { cur.de = `${cur.l}: ${cur.de}; ${lemma}: ${de}`; cur.l = ''; cur.multi = true; }
    else if (cur.multi && lemma) cur.de += `; ${lemma}: ${de}`;
    else cur.de += '; ' + de;
  };
  ['sv', 'es'].forEach(lang => GLOSS_RAW[lang].split('\n').forEach(line => {
    const p = line.split('|');
    if (p.length === 3 && p[0].trim()) put(lang, p[0], p[1].trim(), p[2].trim());
  }));
  const art = { m:'der', f:'die', n:'das' };
  NOUNS.forEach(([de, g, dePl, sv, en, def, pl, defPl]) => {
    put('sv', sv, '', `${de} (${en}-Wort)`, true);
    put('sv', def, sv, `${art[g]} ${de}`, true);
    put('sv', pl, sv, `${dePl} (Plural)`, true);
    put('sv', defPl, sv, `die ${dePl}`, true);
  });
  Object.values(ADJS).forEach(([deBase, , forms, alts]) => [forms].concat(alts || []).forEach(f => {
    put('sv', f[0], '', deBase, true);
    put('sv', f[1], f[0], `${deBase} (bei ett-Wörtern)`, true);
    put('sv', f[2], f[0], f[3] ? `${deBase} (Plural)` : `${deBase} (Plural und bestimmte Form)`, true);
    if (f[3]) put('sv', f[3], f[0], `${deBase} (bestimmte Form)`, true);
    if (f[4]) put('sv', f[4], f[0], `${deBase} (Plural)`, true);
  }));
  VERBS_SV.forEach(v => {
    const de = SV_VERB_DE[v[0]] || '';
    put('sv', v[0], '', de, true);
    put('sv', v[1], v[0], `${de} (Präteritum)`, true);
    put('sv', v[2], v[0], `${de} (Supinum, mit har)`, true);
  });
  const adj = (m, f, de) => { put('es', m, '', de, true); put('es', f, m, de, true); put('es', plEs(m), m, `${de} (Plural)`, true); put('es', plEs(f), m, `${de} (Plural)`, true); };
  SE_STATE.concat(SE_CHAR).forEach(([m, f, de]) => adj(m, f, de));
  Object.keys(SE_RES_DE).forEach(m => adj(m, m.replace(/o$/, 'a'), SE_RES_DE[m]));
  SE_PROF.forEach(a => { put('es', a[0], '', a[4], true); put('es', a[1], a[0], a[5], true); put('es', a[2], a[0], a[6], true); put('es', a[3], a[0], a[7], true); });
  // Genus-Wörter, Zahlen, Uhrzeiten und Präsensformen automatisch aus den Daten der Übungsformen
  GENUS.sv.forEach(([w, g, de]) => put('sv', w, '', `${de} (${g}-Wort)`, true));
  GENUS.es.forEach(([w, g, de]) => put('es', w, '', `${de} (${g} ${w})`, true));
  for (let n = 13; n <= 99; n++) { put('sv', numWords('sv', n), '', String(n), true); }
  SV_UNITS.forEach((w, i) => { if (w) put('sv', w, '', String(i), true); }); SV_TENS.forEach((w, i) => { if (w) put('sv', w, '', String(i * 10), true); });
  Object.entries(ES_TEENS).forEach(([n, w]) => put('es', w, '', n, true)); ES_TENS.forEach((w, i) => { if (w) put('es', w, '', String(i * 10), true); }); ES_UNITS.forEach((w, i) => { if (w) put('es', w, '', String(i), true); });
  SV_H.forEach((w, i) => { if (i) put('sv', w, '', String(i), true); }); ES_H.forEach((w, i) => { if (i) put('es', w, '', String(i), true); });
  Object.entries(SV_PRES).forEach(([inf, pres]) => put('sv', pres, inf, `${SV_VERB_DE[inf] || ''} (Präsens)`, true));
  const PERS_DE = ['yo', 'tú', 'él, ella, usted', 'nosotros', 'ellos, ellas'];
  const TENSE_DE = { pres:'Präsens', indef:'Indefinido', imp:'Imperfecto', subj:'Subjuntivo' };
  const verbs = Object.keys(IRR_ES).map(v => [v, IRR_ES[v][0]]).concat(REG_ES);
  verbs.forEach(([inf, de]) => {
    put('es', inf, '', de, true);
    Object.keys(TENSE_DE).forEach(t => [0, 1, 2, 3, 4].forEach(i => put('es', conjugate(inf, t, i), inf, `${de} (${TENSE_DE[t]}, ${PERS_DE[i]})`, true)));
    put('es', participle(inf), inf, `${de} (Partizip)`, true);
  });
}
function lookupWord(lang, w){
  const k = String(w || '').toLowerCase().replace(/^[¿¡"„“«(]+|[.!?,;"„“”»)…]+$/g, '');
  return GLOSS[lang][k] || GLOSS[lang][k.replace(/:/g, '')] || null;
}
async function wiktionary(lang, w){
  const word = String(w).toLowerCase();
  const res = await fetch('https://en.wiktionary.org/api/rest_v1/page/definition/' + encodeURIComponent(word));
  if (!res.ok) throw new Error('http ' + res.status);
  const j = await res.json();
  const out = [];
  (j[lang] || []).forEach(e => (e.definitions || []).forEach(d => {
    const t = String(d.definition || '').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
    if (t) out.push((e.partOfSpeech ? e.partOfSpeech + ': ' : '') + t);
  }));
  return out.slice(0, 4);
}

// Ostersonntag (gregorianisch, Algorithmus von Meeus/Jones/Butcher)
function easter(y){
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, month - 1, day);
}

const fromEaster = n => y => { const e = easter(y); return new Date(e.getFullYear(), e.getMonth(), e.getDate() + n); };

function nextEvent(lang, todayStr, within){
  const t = dateOf(todayStr), y = t.getFullYear();
  let best = null;
  EVENTS[lang].forEach(ev => [y, y + 1].forEach(yy => {
    const dt = ev[1](yy); if (!dt) return;
    const diff = dayDiff(ymd(dt), todayStr);
    if (diff >= 0 && diff <= within && (!best || diff < best.diff)) best = { ev, dt, diff };
  }));
  return best;
}
const dayIndex = s => Math.floor(dateOf(s).getTime() / 86400000);
// Wählt die Karte des Tages: ein Fest in den nächsten zwei Wochen, ein eigener Satz zum Erinnern oder ein falscher Freund
function fundstueck(lang, t = today()){
  const di = dayIndex(t);
  const ev = nextEvent(lang, t, 14);
  // Feste am Tag selbst und sonst jeden dritten Tag, damit nicht tagelang dieselbe Karte steht
  if (ev && (ev.diff === 0 || di % 3 === 0)) return { kind:'event', ...ev };
  // Wechsel: falscher Freund, Land & Leute, Erinnerung an einen eigenen Satz, Land & Leute
  const slot = di % 4;
  const old = BANK[lang].filter(i => { const s = stOf(i.id); return s && (s.ivl || 0) >= MATURE && s.last && dayDiff(t, s.last) >= 10; });
  if (slot === 2 && old.length) {
    const item = old[(di * 7919) % old.length];
    return { kind:'recall', item, ago:dayDiff(t, stOf(item.id).last) };
  }
  if (slot !== 0) { const k = KULTUR[lang]; return { kind:'kultur', e:k[(di * 7 + (lang === 'es' ? 3 : 0)) % k.length] }; }
  const list = FALSE_FRIENDS[lang];
  return { kind:'friend', ff:list[(di * 31 + (lang === 'es' ? 7 : 0)) % list.length] };
}

    { id:'skandinavien', cat:'sprache', title:'Norska och danska', text:'Schwedisch, Norwegisch und Dänisch sind eng verwandt. Norwegisch versteht man als Schwedischlerner oft erstaunlich gut, Dänisch ist geschrieben leicht und gesprochen schwer.', ex:['Norska är lättare att förstå än danska.', 'Norwegisch ist leichter zu verstehen als Dänisch.'], vars:[['🇸🇪', 'svenska', 'Schweden, Finnland'], ['🇳🇴', 'norska', 'Norwegen'], ['🇩🇰', 'danska', 'Dänemark']], map:{ v:'nord', g:[['SWE'], ['NOR'], ['DNK']], pts:['Stockholm', 'Oslo', 'Köpenhamn'] } },
    { id:'tonfall', cat:'sprache', title:'anden och anden', text:'Schwedisch hat zwei Wortmelodien. „anden“ (die Ente) und „anden“ (der Geist) schreibt man gleich und unterscheidet sie nur am Tonverlauf. Deshalb klingt Schwedisch für viele wie Singen.', ex:['Anden simmar i sjön.', 'Die Ente schwimmt im See.'] }

  es: [
    { id:'coche', cat:'sprache', title:'coche, carro, auto', text:'Für „Auto“ gibt es je nach Land ein anderes Wort. Verstanden wird man mit jedem.', ex:['Vamos en coche al trabajo.', 'Wir fahren mit dem Auto zur Arbeit.'], vars:[['🇪🇸', 'el coche', 'Spanien'], ['🇲🇽', 'el carro', 'Mexiko, Kolumbien, Venezuela'], ['🇦🇷', 'el auto', 'Argentinien, Chile, Uruguay']], map:{ v:'hisp', g:[['ESP'], ['MEX', 'COL', 'VEN'], ['ARG', 'CHL', 'URY']] } },
    { id:'movil', cat:'sprache', title:'¿móvil o celular?', text:'Das Handy heißt in Spanien „móvil“, in ganz Lateinamerika „celular“.', ex:['Se me olvidó el móvil en casa.', 'Ich habe das Handy zu Hause vergessen.'], vars:[['🇪🇸', 'el móvil', 'Spanien'], ['🌎', 'el celular', 'Lateinamerika']], map:{ v:'hisp', g:[['ESP'], LATAM] } },
    { id:'bus', cat:'sprache', title:'¿autobús o guagua?', text:'Kaum ein Wort wechselt so oft wie der Bus. Auf den Kanaren und in der Karibik sagt man „guagua“.', ex:['Tomo el autobús a las ocho.', 'Ich nehme um acht den Bus.'], vars:[['🇪🇸', 'el autobús', 'Spanien'], ['🇲🇽', 'el camión', 'Mexiko'], ['🇦🇷', 'el colectivo', 'Argentinien'], ['🇨🇺', 'la guagua', 'Kuba, Puerto Rico, Dominikanische Republik, Kanaren']], map:{ v:'hisp', g:[['ESP'], ['MEX'], ['ARG'], ['CUB', 'PRI', 'DOM']] } },
    { id:'palta', cat:'sprache', title:'¿aguacate o palta?', text:'Die Avocado hat zwei Namen aus zwei indigenen Sprachen. „aguacate“ kommt aus dem Nahuatl der Azteken (āhuacatl). „palta“ kam über das Quechua ins Spanische; die RAE führt es auf das Volk der Paltas im heutigen Grenzgebiet von Ecuador und Peru zurück. Laut RAE ist „aguacate“ die häufigere Form. Aus dem Nahuatl stammen auch „tomate“, „chocolate“ und „guacamole“, aus dem Quechua „papa“ für die Kartoffel, die in Spanien „patata“ heißt.', ex:['El guacamole se hace con aguacate.', 'Guacamole macht man aus Avocado.'], vars:[['🇲🇽', 'el aguacate', 'Mexiko, Mittelamerika, Karibik, Kolumbien, Venezuela, Ecuador, Paraguay, Spanien'], ['🇵🇪', 'la palta', 'Peru, Bolivien, Chile, Argentinien, Uruguay']], map:{ v:'hisp', g:[['ESP', 'MEX', 'GTM', 'HND', 'SLV', 'NIC', 'CRI', 'PAN', 'CUB', 'DOM', 'PRI', 'COL', 'VEN', 'ECU', 'PRY'], ['PER', 'BOL', 'CHL', 'ARG', 'URY']] } },
    { id:'guay', cat:'sprache', title:'¡Qué guay!', text:'„Cool“ klingt überall anders und verrät sofort, woher jemand kommt.', ex:['¡Qué guay tu chaqueta!', 'Wie cool deine Jacke ist!'], vars:[['🇪🇸', 'guay', 'Spanien'], ['🇲🇽', 'chido', 'Mexiko'], ['🇨🇴', 'chévere', 'Kolumbien, Venezuela'], ['🇨🇱', 'bacán', 'Chile, Peru']], map:{ v:'hisp', g:[['ESP'], ['MEX'], ['COL', 'VEN'], ['CHL', 'PER']] } },
    { id:'ustedes', cat:'sprache', title:'¿vosotros o ustedes?', text:'Für „ihr“ sagt man nur in Spanien „vosotros“. In Lateinamerika heißt es immer „ustedes“, auch unter Freunden.', ex:['¿Vosotros venís a la fiesta?', 'Kommt ihr zur Party? (Lateinamerika: ¿Ustedes vienen?)'], vars:[['🇪🇸', 'vosotros', 'Spanien'], ['🌎', 'ustedes', 'Lateinamerika']], map:{ v:'hisp', g:[['ESP'], LATAM] } },
    { id:'vos', cat:'sprache', title:'vos sos, vos tenés', text:'In Argentinien und Uruguay ersetzt „vos“ das „tú“, mit eigenen Verbformen. Auch in Teilen Mittelamerikas ist das üblich.', ex:['¿Vos sos de Buenos Aires?', 'Bist du aus Buenos Aires?'], vars:[['🇦🇷', 'vos sos', 'Argentinien, Uruguay'], ['🇪🇸', 'tú eres', 'Spanien, Mexiko u. a.']], map:{ v:'hisp', g:[['ARG', 'URY'], ['ESP', ...LATAM.filter(k => k !== 'ARG' && k !== 'URY'), 'GNQ']] } },
    { id:'sobremesa', cat:'alltag', title:'la sobremesa', text:'Die Zeit nach dem Essen, in der man am Tisch sitzen bleibt und redet. Sie kann länger dauern als das Essen selbst.', ex:['La sobremesa duró dos horas.', 'Das Sitzenbleiben nach dem Essen dauerte zwei Stunden.'] },
    { id:'horario', cat:'alltag', title:'Cenamos a las diez', text:'In Spanien isst man spät: zu Mittag gegen 14 oder 15 Uhr, zu Abend oft erst um 21 oder 22 Uhr. Restaurants öffnen abends entsprechend spät.', ex:['Normalmente cenamos a las diez.', 'Normalerweise essen wir um zehn zu Abend.'] },
    { id:'menu', cat:'alltag', title:'el menú del día', text:'Mittags bieten viele Lokale in Spanien ein festes Menü: Vorspeise, Hauptgang, Nachtisch oder Kaffee, Brot und Getränk zum Festpreis.', ex:['¿Qué hay de menú del día?', 'Was gibt es als Tagesmenü?'] },
    { id:'puente', cat:'alltag', title:'hacer puente', text:'Fällt ein Feiertag auf Dienstag oder Donnerstag, nehmen viele den Tag dazwischen frei: „hacer puente“, eine Brücke schlagen.', ex:['Este puente nos vamos a la playa.', 'Über das lange Wochenende fahren wir ans Meer.'] },
    { id:'vale', cat:'alltag', title:'vale, venga', text:'In Spanien hört man „vale“ (okay) und „venga“ (los, komm, na gut) ständig, oft mehrmals pro Satz.', ex:['Vale, quedamos a las ocho.', 'Okay, wir treffen uns um acht.'] },
    { id:'ahorita', cat:'alltag', title:'ahorita', text:'In Mexiko heißt „ahorita“ wörtlich „gleich jetzt“, kann aber auch „irgendwann später“ bedeuten. Der Ton verrät, welches gemeint ist.', ex:['Ahorita lo hago.', 'Mach ich gleich. (Oder später.)'] },
    { id:'estrenar', cat:'alltag', title:'estrenar', text:'Etwas zum ersten Mal benutzen oder tragen. Dafür hat das Deutsche kein eigenes Verb.', ex:['Hoy estreno zapatos.', 'Heute trage ich zum ersten Mal meine neuen Schuhe.'] },
    { id:'mate', cat:'alltag', title:'¿Tomamos unos mates?', text:'In Argentinien, Uruguay und Paraguay trinkt man Mate aus einem gemeinsamen Gefäß mit Metallhalm, der Bombilla. Es geht reihum, wer genug hat, sagt „gracias“.', ex:['¿Tomamos unos mates en el parque?', 'Trinken wir ein paar Mate im Park?'] },
    { id:'tutear', cat:'gesellschaft', title:'tutear', text:'In Spanien duzt man schnell, auch Fremde im eigenen Alter. In Teilen Kolumbiens siezt man dagegen sogar in der Familie mit „usted“.', ex:['¿Nos tuteamos?', 'Wollen wir uns duzen?'] },
    { id:'lenguas', cat:'gesellschaft', title:'catalán, gallego, euskera', text:'In Katalonien, Galicien und im Baskenland sind die Regionalsprachen neben Spanisch Amtssprachen. Baskisch ist mit keiner anderen bekannten Sprache verwandt.', ex:['En Barcelona se habla catalán y castellano.', 'In Barcelona spricht man Katalanisch und Spanisch.'] },
    { id:'autonomias', cat:'geografie', title:'las comunidades autónomas', text:'Spanien besteht aus 17 autonomen Gemeinschaften mit eigenen Parlamenten, dazu den autonomen Städten Ceuta und Melilla in Nordafrika.', ex:['Andalucía es la comunidad más poblada.', 'Andalusien ist die bevölkerungsreichste Region.'] },
    { id:'mundo', cat:'geografie', title:'El español en el mundo', text:'Spanisch ist Amtssprache in 20 Ländern und in Puerto Rico, mit rund 500 Millionen Muttersprachlern. In den USA sprechen über 40 Millionen Menschen zu Hause Spanisch.', ex:['El español es lengua oficial en veinte países.', 'Spanisch ist in zwanzig Ländern Amtssprache.'], vars:[['🌍', 'lengua oficial', '20 Länder und Puerto Rico'], ['🇺🇸', 'más de 40 millones', 'sprechen in den USA zu Hause Spanisch']], map:{ v:'hisp', g:[['ESP', 'GNQ', ...LATAM], ['USA']], soft:[1] } }
  ]

const $ = (s, el = document) => el.querySelector(s);

const pad = n => String(n).padStart(2, '0');
const fmt = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());

const addDays = (ds, n) => { const [y, m, d] = ds.split('-').map(Number); return fmt(new Date(y, m - 1, d + n)); };
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };

const deacc = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const joinList = p => (p.length > 1 ? p.slice(0, -1).join(', ') + ' und ' + p[p.length - 1] : (p[0] || ''));

function norm(s, lang){
  let t = String(s || '').toLowerCase().replace(/[’`´]/g, "'").replace(/[.!?¡¿,;"„“”«»()…]/g, ' ').replace(/[–—]/g, ' ').replace(/\s+/g, ' ').trim();
  if (lang === 'sv') t = t.replace(/\bi (dag|morgon|går|kväll|morse|natt)\b/g, 'i$1');
  else if (lang === 'es') t = t.replace(/^(yo|tú|tu|él|ella|nosotros|nosotras|ellos|ellas|usted|ustedes) (?=\S+ \S)/, '');

}

let BANK = { sv:[], es:[] };
// Position der Lücke im Zielsatz: nur ganze Wörter. Eine reine Zeichensuche fände „en“ zuerst in „Pienso“
// und „es“ in „fiesta“; dann stünde die Lücke im falschen Wort.
function gapPos(target, gap){
  if (!gap) return -1;
  const L = 'A-Za-zÀ-ÖØ-öø-ÿ', re = new RegExp(`(?<![${L}])${gap.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}(?![${L}])`);
  const m = re.exec(target);
  return m ? m.index : target.indexOf(gap);
}
function buildBank(){
  BANK = { sv:[], es:[] };
  ['sv', 'es'].forEach(lang => {
    TRAPS[lang].forEach(tr => {
      const raw = CONTENT[lang][tr.id];
      if (!raw) return;
      raw.split('\n').map(l => l.trim()).filter(Boolean).forEach(line => {
        const p = line.split('|').map(x => x.trim());
        if (p.length < 2) return;
        const [de, target, gap = '', hint = '', alts = ''] = p;
        const gaps = gap ? gap.split('/').map(x => x.trim()).filter(Boolean) : [];
        const altList = alts ? alts.split(';;').map(x => x.trim()).filter(Boolean) : [];
        if (gaps[0]) {
          // Lückenfüllungen, die sich aus den alternativen Sätzen ergeben (gleicher Anfang und gleiches Ende)
          const pos = gapPos(target, gaps[0]);
          const pre = target.slice(0, pos), post = target.slice(pos + gaps[0].length);
          altList.forEach(a => { if (pos >= 0 && a.startsWith(pre) && a.endsWith(post) && a.length > pre.length + post.length) { const fill = a.slice(pre.length, a.length - post.length).trim(); if (fill && !gaps.includes(fill)) gaps.push(fill); } });
        }
        BANK[lang].push({ id:lang + ':' + hash(target), lang, trap:tr.id, kind:tr.kind === 'order' ? 'order' : 'form', de, target, gap:gaps[0] || '', gapAlts:gaps, hint, alts:altList });
      });
    });
    (DB.own[lang] || []).forEach(o => BANK[lang].push({ id:o.id, lang, trap:'eigene', kind:'order', de:o.de, target:o.target, gap:'', gapAlts:[], hint:'', alts:[], own:true }));
    (DB.tat[lang] || []).forEach(o => BANK[lang].push({ id:o.id, lang, trap:o.trap, kind:'order', de:o.de, target:o.target, gap:'', gapAlts:[], hint:'', alts:[], own:o.trap === 'eigene' && !o.auto, tat:o }));
  });
}
const itemById = id => BANK.sv.find(i => i.id === id) || BANK.es.find(i => i.id === id);
function trapMeta(lang, id){
  if (id === 'eigene') return { id, label:'Gesammelte Sätze', kind:'order', short:'', rule:'' };
  return TRAPS[lang].find(t => t.id === id);
}

const KEY = 'tagwerk-offline-v1';
const freshDB = () => ({ v:3, settings:{ size:'normal', lang:'sv', refill:true }, used:{}, tatFetch:{}, st:{}, own:{ sv:[], es:[] }, tat:{ sv:[], es:[] }, log:{}, done:{}, gen:{}, run:null });

function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      DB = Object.assign(freshDB(), d);
      DB.settings = Object.assign(freshDB().settings, d.settings || {});

      DB.own = Object.assign({ sv:[], es:[] }, d.own || {});
      DB.tat = Object.assign({ sv:[], es:[] }, d.tat || {});
      migrateStates();
    }
  } catch (e) { note('Gespeicherte Daten ließen sich nicht lesen. Spiel ein Backup ein, falls du eines hast.', 'warn'); }
}
function migrateStates(){
  const old = [0, 1, 2, 4, 8, 16, 32, 64];
  Object.values(DB.st).forEach(st => {
    if (st.s != null) return;
    const ivl = old[Math.min(st.lv || 0, 7)] || 1;
    st.s = Math.max(0.5, ivl); st.d = Math.min(10, Math.max(1, 5 + 0.5 * ((st.bad || 0) - (st.ok || 0))));
    st.ivl = ivl; st.last = addDays(st.due || today(), -ivl); st.reps = st.ok || 0; st.lapses = st.bad || 0;
  });
}
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {

function snapshot(){

  ['sv', 'es'].forEach(l => {

function dayLog(d, lang){ const x = DB.log[d] && DB.log[d][lang]; return typeof x === 'number' ? { n:x } : (x || {}); }
function logDay(lang, f){
  const d = today();
  DB.log[d] = DB.log[d] || {};
  const x = dayLog(d, lang);
  Object.keys(f).forEach(k => { x[k] = (x[k] || 0) + f[k]; });

  const keys = Object.keys(DB.log).sort();
  while (keys.length > 400) delete DB.log[keys.shift()];
}
const logAct = (lang, n) => logDay(lang, { n:n || 1 });
const dayDiff = (a, b) => Math.round((new Date(a.slice(0, 4), a.slice(5, 7) - 1, a.slice(8, 10)) - new Date(b.slice(0, 4), b.slice(5, 7) - 1, b.slice(8, 10))) / 86400000);
// Serie: Ein Tag zählt, wenn ein Tagwerk erledigt wurde. Ein ausgelassener Tag pro 7 Tage unterbricht sie nicht.
function streakData(){
  const days = Object.keys(DB.done).filter(x => DB.done[x]).sort();
  const t = today(), free = new Set();
  let cur = 0, best = 0, lastFree = null;
  if (!days.length) return { current:0, longest:0, free };
  for (let x = days[0]; x <= t; x = addDays(x, 1)) {
    if (DB.done[x]) { cur++; best = Math.max(best, cur); continue; }
    if (x === t) break;
    const nx = addDays(x, 1);
    if (cur > 0 && (DB.done[nx] || nx === t) && (!lastFree || dayDiff(x, lastFree) >= 7)) { free.add(x); lastFree = x; }
    else { cur = 0; lastFree = null; }
  }
  return { current:cur, longest:best, free };
}
const streak = () => streakData().current;
function sumLog(lang, days, key){ let n = 0; for (let k = 0; k < days; k++) n += dayLog(addDays(today(), -k), lang)[key] || 0; return n; }
const week = lang => sumLog(lang, 7, 'n');
function mondayOf(ds){ const [y, m, d] = ds.split('-').map(Number); const dt = new Date(y, m - 1, d); const wd = (dt.getDay() + 6) % 7; return addDays(ds, -wd); }
const MATURE = 21, ANCHORED = 365;
const matureCount = lang => BANK[lang].filter(i => { const s = stOf(i.id); return s && (s.ivl || 0) >= MATURE; }).length;
const strongCount = matureCount;

function milestoneList(upTo){
  const out = [10, 25, 50, 100, 150, 200, 300, 400, 500, 750, 1000];
  for (let m = 1500; m <= Math.max(upTo, 1500) + 500; m += 500) out.push(m);
  return out;
}
const nextMilestone = n => milestoneList(n).find(m => m > n);
const prevMilestone = n => [0].concat(milestoneList(n)).filter(m => m <= n).pop();
const knownEstimate = lang => BANK[lang].reduce((a, i) => a + FSRS.retrievability(stOf(i.id), today()), 0);
function streakMilestone(n){

  if (n % 365 === 0) return n === 365 ? 'Ein Jahr in Folge.' : `${n / 365} Jahre in Folge.`;

/* ---------- Zustand ---------- */
const S = { lang:'sv', view:'home', run:null, dailyRun:null, notice:null, armed:null, shadow:null, write:null, own:null, tat:null };
function note(text, kind){ S.notice = text ? { text, kind:kind || 'ok' } : null; }
const size = () => SIZES[DB.settings.size] || SIZES.normal;

function stOf(id){ return DB.st[id]; }
function stage(item){
  const st = stOf(item.id);
  if (st && (st.reps || 0) >= 2) return 'free';
  return item.kind === 'order' ? 'tiles' : 'cloze';
}
function dueItems(lang){
  const t = today();
  return BANK[lang].filter(i => { const s = stOf(i.id); return s && s.due <= t; }).sort((a, b) => stOf(a.id).due.localeCompare(stOf(b.id).due));
}
function pickNew(lang, n, onlyTrap){
  const unseen = BANK[lang].filter(i => !stOf(i.id) && (!onlyTrap || i.trap === onlyTrap));
  const out = unseen.filter(i => i.own || (i.tat && !i.tat.auto)).slice(0, Math.max(1, Math.ceil(n / 2)));
  const count = {};
  BANK[lang].forEach(i => { if (stOf(i.id)) count[i.trap] = (count[i.trap] || 0) + 1; });
  while (out.length < n) {
    const rest = unseen.filter(i => !out.includes(i));
    if (!rest.length) break;
    const traps = [...new Set(rest.map(i => i.trap))];
    traps.sort((a, b) => (count[a] || 0) - (count[b] || 0) || Math.random() - 0.5);
    const tr = traps[0];
    const item = rest.find(i => i.trap === tr);
    out.push(item); count[tr] = (count[tr] || 0) + 1;
  }
  return out;
}
const genIds = lang => Object.keys(GENS).filter(g => GENS[g].lang === lang && !GENS[g].form);
const formIds = lang => Object.keys(GENS).filter(g => GENS[g].lang === lang && GENS[g].form);
function dayGen(lang){
  const g = genIds(lang);
  if (!g.length) return null;
  return g[Math.floor(Date.now() / 86400000) % g.length];
}
const exFor = item => ({ type:stage(item), id:item.id });
function shuffleInPlace(a){ for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function dailyPlan(lang){
  const sz = size();
  const due = dueItems(lang).slice(0, sz.maxRev);
  const fresh = pickNew(lang, sz.newPer);
  const g = dayGen(lang);
  const base = shuffle(due).map(exFor).concat(fresh.map(exFor));
  // Die Hälfte der Grammatik-Aufgaben aus dem Generator des Tages, der Rest aus den anderen Übungsformen, täglich wechselnd
  const fx = formIds(lang).filter(f => GENS[f].daily), day = Math.floor(Date.now() / 86400000);
  const nForm = fx.length ? Math.floor(sz.gen / 2) : 0;
  const drills = g ? Array.from({ length:sz.gen - nForm }, () => ({ type:'gen', gen:g })) : [];
  for (let i = 0; i < nForm; i++) drills.push({ type:'gen', gen:fx[(day + i) % fx.length] });
  shuffleInPlace(drills);
  // gemischt statt Block: Formübungen gleichmäßig zwischen die Sätze verteilen
  // Erst ein Satz, dann abwechselnd; die Formübungen verteilen sich gleichmäßig
  const queue = [];
  const step = drills.length ? Math.max(1, base.length / drills.length) : Infinity;
  let next = step, di = 0;
  base.forEach((ex, i) => { queue.push(ex); while (di < drills.length && i + 1 >= next) { queue.push(drills[di++]); next += step; } });
  while (di < drills.length) queue.push(drills[di++]);
  const genLabels = [...new Set(drills.slice().sort((a, b) => (GENS[a.gen].form ? 1 : 0) - (GENS[b.gen].form ? 1 : 0)).map(x => GENS[x.gen].short || GENS[x.gen].label))];
  return { queue, due:due.length, fresh:fresh.length, gen:g, genN:drills.length, genLabels };
}
const minutes = queue => Math.max(1, Math.round(queue.reduce((s, ex) => s + (SECS[ex.type] || 25), 0) * 1.15 / 60));

function startRun(kind, opts){
  const lang = S.lang;
  let queue = [];
  if (kind === 'daily') queue = dailyPlan(lang).queue;
  else if (kind === 'quick') {
    queue = dueItems(lang).slice(0, 6).map(exFor);
    if (queue.length < 6) {
      const t = today(), have = new Set(queue.map(x => x.id));
      const weak = BANK[lang].filter(i => { const s = stOf(i.id); return s && !have.has(i.id) && s.last !== t; })
        .sort((a, b) => FSRS.retrievability(stOf(a.id), t) - FSRS.retrievability(stOf(b.id), t));
      queue = queue.concat(weak.slice(0, 6 - queue.length).map(exFor));
    }
    const g = genIds(lang);
    while (queue.length < 6 && g.length) queue.push({ type:'gen', gen:pick(g) });
  } else if (kind === 'trap') {
    const tr = trapMeta(lang, opts.trap);
    if (tr.kind === 'gen') { for (let i = 0; i < 10; i++) queue.push({ type:'gen', gen:tr.gen }); }
    else {
      const items = BANK[lang].filter(i => i.trap === tr.id);
      const t = today();
      const due = items.filter(i => stOf(i.id) && stOf(i.id).due <= t);
      // Heute schon Geübtes nach hinten, sonst brächte ein zweites „Thema üben“ dieselben Sätze
      const mem = DB.used.recentPick = DB.used.recentPick || {}, recent = mem['trap_' + tr.id] || [];
      const seen = items.filter(i => stOf(i.id) && !due.includes(i)).sort((a, b) => (recent.includes(a.id) - recent.includes(b.id)) || ((stOf(a.id).last === t) - (stOf(b.id).last === t)) || (FSRS.retrievability(stOf(a.id), t) - FSRS.retrievability(stOf(b.id), t)));
      const fresh = pickNew(lang, 10, tr.id);
      const nGen = tr.gen ? 3 : 0;
      queue = due.concat(fresh, seen).slice(0, 10 - nGen).map(exFor);
      mem['trap_' + tr.id] = queue.map(x => x.id);
      for (let i = 0; i < nGen; i++) queue.splice(Math.round((i + 1) * queue.length / (nGen + 1)) + i, 0, { type:'gen', gen:tr.gen });
    }
  } else if (kind === 'gen') queue = [{ type:'gen', gen:opts.gen }];
  else if (kind === 'form') queue = Array.from({ length:10 }, () => ({ type:'gen', gen:opts.gen }));
